        /* =========================
           Add node
        ========================= */

        function addChildTo(parentId, autoEdit = false) {
            finishCurrentEditing();

            const parent = nodes.find(
                (node) => node.id === parentId
            );

            if (!parent) return;

            const siblings = nodes.filter(
                (node) => node.parentId === parentId
            );

            const newX =
                parent.x +
                parent.width +
                80;

            const newY =
                parent.y +
                siblings.length * 65;

            const newId = createNode(
                "新節點",
                newX,
                newY,
                parentId,
                autoEdit,
                true
            );

            selectNode(newId);
        }

        function addSiblingTo(id, autoEdit = false) {
            finishCurrentEditing();

            const node = nodes.find(
                (item) => item.id === id
            );

            if (!node) return;

            if (node.parentId === null || node.parentId === undefined) {
                addChildTo(id, autoEdit);
                return;
            }

            const newId = createNode(
                "新節點",
                node.x,
                node.y + node.height + 20,
                node.parentId,
                autoEdit,
                true
            );

            selectNode(newId);
        }

        function addChildToSelected(autoEdit = false) {
            if (selectedId !== null) {
                addChildTo(selectedId, autoEdit);
            }
        }

        function addSiblingToSelected(autoEdit = false) {
            if (selectedId !== null) {
                addSiblingTo(selectedId, autoEdit);
            }
        }

        /* =========================
           Delete
        ========================= */

        function getDescendantIds(parentId) {
            const result = [];
            const children = nodes.filter(
                (node) => node.parentId === parentId
            );

            children.forEach((child) => {
                result.push(child.id);
                result.push(...getDescendantIds(child.id));
            });

            return result;
        }

        function deleteNodeById(id) {
            finishCurrentEditing();

            const snapshot = captureState();
            const idsToDelete = new Set([
                id,
                ...getDescendantIds(id)
            ]);

            nodes = nodes.filter(
                (node) => !idsToDelete.has(node.id)
            );

            crossLinks = crossLinks.filter((link) => {
                return (
                    !idsToDelete.has(link.fromId) &&
                    !idsToDelete.has(link.toId)
                );
            });

            selectedId = null;

            treeCanvas
                .querySelectorAll(".node, .link-box")
                .forEach((element) => element.remove());

            nodes.forEach(renderNode);
            renderLinkBoxes();
            drawLines();

            pushHistorySnapshot(snapshot);
        }

        function deleteBoxById(boxId) {
            finishCurrentEditing();

            const snapshot = captureState();

            crossLinks.forEach((link) => {
                link.boxes = link.boxes.filter(
                    (box) => box.id !== boxId
                );
            });

            selectedBoxId = null;

            document.getElementById(`box-${boxId}`)?.remove();

            pushHistorySnapshot(snapshot);
        }

        function deleteSelected() {
            if (selectedId !== null) {
                deleteNodeById(selectedId);
                return;
            }

            if (selectedBoxId !== null) {
                deleteBoxById(selectedBoxId);
            }
        }

        /* =========================
           Cross links
        ========================= */

        function startLink(id) {
            finishCurrentEditing();
            
            cancelRelationshipMode();

            linkMode = true;
            linkFromId = id;

            canvasArea.classList.add("linking");

            document
                .querySelectorAll(".node")
                .forEach((node) => {
                    node.classList.remove("linking-source");
                });

            document
                .getElementById(`node-${id}`)
                ?.classList.add("linking-source");

            const fromNode = nodes.find(
                (node) => node.id === id
            );

            if (!fromNode) return;

            const centerX =
                fromNode.x + fromNode.width / 2;

            const centerY =
                fromNode.y + fromNode.height / 2;

            tempLinkLine.setAttribute("x1", centerX);
            tempLinkLine.setAttribute("y1", centerY);
            tempLinkLine.setAttribute("x2", centerX);
            tempLinkLine.setAttribute("y2", centerY);
            tempLinkLine.style.display = "block";
        }

        function completeLink(targetId) {
            if (
                linkFromId === null ||
                targetId === linkFromId
            ) {
                return;
            }

            const from = nodes.find(
                (node) => node.id === linkFromId
            );

            const to = nodes.find(
                (node) => node.id === targetId
            );

            if (!from || !to) {
                cancelLinkMode();
                return;
            }

            const duplicate = crossLinks.some((link) => {
                return (
                    (link.fromId === from.id &&
                        link.toId === to.id) ||
                    (link.fromId === to.id &&
                        link.toId === from.id)
                );
            });

            if (duplicate) {
                cancelLinkMode();
                return;
            }

            const snapshot = captureState();

            const box = {
                id: nextBoxId++,
                text: "連結",
                x:
                    (
                        from.x +
                        from.width / 2 +
                        to.x +
                        to.width / 2
                    ) / 2 -
                    55,
                y:
                    (
                        from.y +
                        from.height / 2 +
                        to.y +
                        to.height / 2
                    ) / 2 -
                    17,
                width: 110,
                height: 34,
                color1: "#ffffff",
                color2: "#ffffff",
                colorType: "solid",
                opacity: 0.96,
                deg: 135
            };

            crossLinks.push({
                id: nextLinkId++,
                fromId: from.id,
                toId: to.id,
                boxes: [box]
            });

            cancelLinkMode();
            renderSingleLinkBox(box);
            drawLines();

            pushHistorySnapshot(snapshot);

            window.setTimeout(() => {
                startTextEdit("box", box.id);
            }, 30);
        }

        function cancelLinkMode() {
            linkMode = false;
            linkFromId = null;

            canvasArea.classList.remove("linking");

            tempLinkLine.style.display = "none";

            document
                .querySelectorAll(".node")
                .forEach((node) => {
                    node.classList.remove("linking-source");
                });
        }
        
        /* =========================
           轉父節點／取消指定連結
        ========================= */

        function startReparentSelected() {
            if (selectedId === null) {
                alert("請先選擇需要轉換父節點嘅節點。");
                return;
            }

            startReparent(selectedId);
        }

        function startUnlinkSelected() {
            if (selectedId === null) {
                alert("請先選擇連線其中一個節點。");
                return;
            }

            startUnlink(selectedId);
        }

        /*
        使用方式：
        選擇 B → startReparent(B) → 點擊 X
        結果：B.parentId 變成 X
        B 下面全部子節點都會保留
        */
        function startReparent(nodeId) {
            finishCurrentEditing();
            stopSpeechRecognition(true);

            if (linkMode) {
                cancelLinkMode();
            }

            cancelRelationshipMode();

            const node = nodes.find((item) => item.id === nodeId);

            if (!node) return;

            relationshipMode = "reparent";
            relationshipSourceId = nodeId;

            selectNode(nodeId);

            document
                .getElementById(`node-${nodeId}`)
                ?.classList.add("relationship-source");

            showRelationshipMessage(
                `⇆ 轉父節點：請撳新父節點。正在移動「${node.text}」；按 Esc 取消。`
            );
        }

        /*
        選擇 A → startUnlink(A) → 點擊 B
        只取消 A、B 之間嘅直接連線
        */
        function startUnlink(nodeId) {
            finishCurrentEditing();
            stopSpeechRecognition(true);

            if (linkMode) {
                cancelLinkMode();
            }

            cancelRelationshipMode();

            const node = nodes.find((item) => item.id === nodeId);

            if (!node) return;

            relationshipMode = "unlink";
            relationshipSourceId = nodeId;

            selectNode(nodeId);

            document
                .getElementById(`node-${nodeId}`)
                ?.classList.add("relationship-source");

            showRelationshipMessage(
                `⛓ 取消連結：請撳另一個節點。只會取消同「${node.text}」之間嘅直接連線；按 Esc 取消。`
            );
        }

        /*
        完成轉父節點
        */
        function completeReparent(newParentId) {
            const movingNodeId = relationshipSourceId;

            const movingNode = nodes.find(
                (item) => item.id === movingNodeId
            );

            const newParent = nodes.find(
                (item) => item.id === newParentId
            );

            if (!movingNode || !newParent) {
                cancelRelationshipMode();
                return;
            }

            if (movingNodeId === newParentId) {
                alert("一個節點唔可以成為自己嘅父節點。");
                return;
            }

            /*
            防止循環：
            例如 A → B → C
            唔可以將 A 放落 C 下面，
            否則會變成 A → B → C → A
            */
            if (isNodeInsideSubtree(newParentId, movingNodeId)) {
                alert(
                    "無法轉換：新父節點係目前節點嘅子節點，咁樣會造成循環連線。"
                );
                return;
            }

            if (movingNode.parentId === newParentId) {
                cancelRelationshipMode();
                selectNode(movingNodeId);
                return;
            }

            const snapshot = captureState();

            /*
            只修改 parentId：
            唔會刪除 movingNode，
            亦唔會刪除 movingNode 下面嘅任何子節點。
            */
            movingNode.parentId = newParentId;

            drawLines();

            pushHistorySnapshot(snapshot);

            cancelRelationshipMode();
            selectNode(movingNodeId);
        }

        /*
        檢查 candidateId 係咪 rootId 子樹內嘅節點
        */
        function isNodeInsideSubtree(candidateId, rootId) {
            let currentId = candidateId;
            const checkedIds = new Set();

            while (
                currentId !== null &&
                currentId !== undefined
            ) {
                if (currentId === rootId) {
                    return true;
                }

                if (checkedIds.has(currentId)) {
                    return true;
                }

                checkedIds.add(currentId);

                const currentNode = nodes.find(
                    (item) => item.id === currentId
                );

                if (!currentNode) {
                    return false;
                }

                currentId = currentNode.parentId;
            }

            return false;
        }

        /*
        完成取消兩點連結

        處理次序：
        1. 如果兩點之間有橙色 Cross Link，先移除 Cross Link
        2. 如果冇 Cross Link，就移除父子關係線
        */
        function completeUnlink(targetId) {
            const sourceId = relationshipSourceId;

            if (
                sourceId === null ||
                sourceId === targetId
            ) {
                return;
            }

            const sourceNode = nodes.find(
                (item) => item.id === sourceId
            );

            const targetNode = nodes.find(
                (item) => item.id === targetId
            );

            if (!sourceNode || !targetNode) {
                cancelRelationshipMode();
                return;
            }

            const snapshot = captureState();
            let removed = false;
            let removedType = "";

            /*
            先檢查兩點之間有冇橙色跨節點連線
            */
            const matchingCrossLinks = crossLinks.filter((link) => {
                return (
                    (
                        link.fromId === sourceId &&
                        link.toId === targetId
                    ) ||
                    (
                        link.fromId === targetId &&
                        link.toId === sourceId
                    )
                );
            });

            if (matchingCrossLinks.length > 0) {
                const matchingIds = new Set(
                    matchingCrossLinks.map((link) => link.id)
                );

                crossLinks = crossLinks.filter(
                    (link) => !matchingIds.has(link.id)
                );

                removed = true;
                removedType = "cross-link";

                /*
                Cross Link 被刪除後，
                其附屬 Link Box 亦會移除。
                */
                renderLinkBoxes();
            } else if (targetNode.parentId === sourceId) {
                /*
                A → B：
                B.parentId 由 A 改成 null。
                B 下面嘅子節點全部保留。
                */
                targetNode.parentId = null;
                removed = true;
                removedType = "parent-link";
            } else if (sourceNode.parentId === targetId) {
                /*
                B → A：
                A.parentId 由 B 改成 null。
                A 下面嘅子節點全部保留。
                */
                sourceNode.parentId = null;
                removed = true;
                removedType = "parent-link";
            }

            if (!removed) {
                cancelRelationshipMode();

                alert(
                    `「${sourceNode.text}」同「${targetNode.text}」之間冇直接連線。`
                );

                return;
            }

            drawLines();
            pushHistorySnapshot(snapshot);

            cancelRelationshipMode();

            if (removedType === "parent-link") {
                /*
                保持被取消父子關係嘅節點仍然存在
                */
                if (targetNode.parentId === null) {
                    selectNode(targetNode.id);
                } else if (sourceNode.parentId === null) {
                    selectNode(sourceNode.id);
                }
            } else {
                selectNode(sourceId);
            }
        }

        function cancelRelationshipMode() {
            relationshipMode = null;
            relationshipSourceId = null;

            document
                .querySelectorAll(".node")
                .forEach((element) => {
                    element.classList.remove("relationship-source");
                });

            hideRelationshipMessage();
        }

        function showRelationshipMessage(message) {
            if (!relationshipModeBanner) return;

            relationshipModeBanner.textContent = message;
            relationshipModeBanner.classList.add("active");
        }

        function hideRelationshipMessage() {
            if (!relationshipModeBanner) return;

            relationshipModeBanner.textContent = "";
            relationshipModeBanner.classList.remove("active");
        }

        /* =========================
           Draw lines
        ========================= */

        function drawLines() {
            Array.from(svg.children).forEach((child) => {
                if (child.id !== "temp-link-line") {
                    child.remove();
                }
            });

            nodes.forEach((node) => {
                if (
                    node.parentId === null ||
                    node.parentId === undefined
                ) {
                    return;
                }

                const parent = nodes.find(
                    (item) => item.id === node.parentId
                );

                if (!parent) return;

                const startX =
                    parent.x + parent.width;

                const startY =
                    parent.y + parent.height / 2;

                const endX = node.x;
                const endY =
                    node.y + node.height / 2;

                const controlX =
                    (startX + endX) / 2;

                const path = document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "path"
                );

                path.setAttribute(
                    "d",
                    `M ${startX} ${startY}
                     C ${controlX} ${startY},
                       ${controlX} ${endY},
                       ${endX} ${endY}`
                );

                path.setAttribute("class", "branch-line");
                path.setAttribute(
                    "stroke",
                    node.color1 || "#4285f4"
                );

                svg.appendChild(path);
            });

            crossLinks.forEach((link) => {
                const from = nodes.find(
                    (node) => node.id === link.fromId
                );

                const to = nodes.find(
                    (node) => node.id === link.toId
                );

                if (!from || !to) return;

                const startX =
                    from.x + from.width / 2;

                const startY =
                    from.y + from.height / 2;

                const endX =
                    to.x + to.width / 2;

                const endY =
                    to.y + to.height / 2;

                const middleX =
                    (startX + endX) / 2;

                const middleY =
                    (startY + endY) / 2 - 40;

                const path = document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "path"
                );

                path.setAttribute(
                    "d",
                    `M ${startX} ${startY}
                     Q ${middleX} ${middleY}
                       ${endX} ${endY}`
                );

                path.setAttribute("class", "cross-link");
                path.setAttribute("stroke", "#ff9800");

                svg.appendChild(path);
            });
        }

        /* =========================
           Speech input
        ========================= */

        function createSpeechButton(type, id) {
            const button = document.createElement("button");

            button.type = "button";
            button.className = "speech-btn";
            button.textContent = "🎤";
            button.title = "語音輸入；再按一次停止";

            button.addEventListener("mousedown", stopInteractiveEvent);

            button.addEventListener("click", async (event) => {
                event.preventDefault();
                event.stopPropagation();

                await startSpeechFor(type, id, button);
            });

            return button;
        }

        async function requestPermanentMicrophonePermission() {
            try {
                if (
                    !navigator.mediaDevices ||
                    !navigator.mediaDevices.getUserMedia
                ) {
                    throw new Error(
                        "瀏覽器不支援咪高峰權限功能"
                    );
                }

                const stream =
                    await navigator.mediaDevices.getUserMedia({
                        audio: true
                    });

                stream
                    .getTracks()
                    .forEach((track) => track.stop());

                localStorage.setItem(
                    "mindmap-microphone-enabled",
                    "true"
                );

                updatePermissionStatus(
                    "granted",
                    "✅ 咪高峰權限已允許。瀏覽器會按照網站權限設定保留。"
                );
            } catch (error) {
                console.error(error);

                updatePermissionStatus(
                    "denied",
                    "❌ 未能取得咪高峰權限。請在瀏覽器網站設定內改為「允許」。"
                );

                alert(
                    "未能取得咪高峰權限。\n\n" +
                    "請確認：\n" +
                    "1. 網頁使用 HTTPS 或 localhost\n" +
                    "2. 瀏覽器網站權限已允許咪高峰\n" +
                    "3. 裝置有可用咪高峰"
                );
            }
        }

        async function ensureMicrophonePermission() {
            if (
                !navigator.mediaDevices ||
                !navigator.mediaDevices.getUserMedia
            ) {
                return true;
            }

            try {
                const stream =
                    await navigator.mediaDevices.getUserMedia({
                        audio: true
                    });

                stream
                    .getTracks()
                    .forEach((track) => track.stop());

                localStorage.setItem(
                    "mindmap-microphone-enabled",
                    "true"
                );

                updatePermissionStatus(
                    "granted",
                    "✅ 咪高峰權限已允許"
                );

                return true;
            } catch (error) {
                updatePermissionStatus(
                    "denied",
                    "❌ 咪高峰權限被拒絕"
                );

                return false;
            }
        }

        async function checkMicrophonePermission() {
            if (!navigator.permissions?.query) {
                const remembered =
                    localStorage.getItem(
                        "mindmap-microphone-enabled"
                    ) === "true";

                updatePermissionStatus(
                    remembered ? "granted" : "prompt",
                    remembered
                        ? "✅ 此網站之前已啟用咪高峰"
                        : "按上方按鈕啟用咪高峰權限"
                );

                return;
            }

            try {
                const status =
                    await navigator.permissions.query({
                        name: "microphone"
                    });

                updatePermissionFromState(status.state);

                status.addEventListener("change", () => {
                    updatePermissionFromState(status.state);
                });
            } catch (error) {
                updatePermissionStatus(
                    "prompt",
                    "按上方按鈕啟用咪高峰權限"
                );
            }
        }

        function updatePermissionFromState(state) {
            if (state === "granted") {
                updatePermissionStatus(
                    "granted",
                    "✅ 咪高峰權限已允許"
                );
            } else if (state === "denied") {
                updatePermissionStatus(
                    "denied",
                    "❌ 咪高峰權限已被瀏覽器封鎖"
                );
            } else {
                updatePermissionStatus(
                    "prompt",
                    "尚未設定咪高峰權限"
                );
            }
        }

        function updatePermissionStatus(type, message) {
            permissionStatus.className = "permission-status";

            if (type === "granted") {
                permissionStatus.classList.add("granted");
            }

            if (type === "denied") {
                permissionStatus.classList.add("denied");
            }

            permissionStatus.textContent = message;
        }

        async function startSpeechFor(type, id, button) {
            if (
                activeRecognition &&
                activeSpeechButton === button
            ) {
                stopSpeechRecognition(true);
                return;
            }

            stopSpeechRecognition(true);
            finishCurrentEditing();

            const SpeechRecognition =
                window.SpeechRecognition ||
                window.webkitSpeechRecognition;

            if (!SpeechRecognition) {
                alert(
                    "此瀏覽器不支援 Web Speech Recognition。\n\n" +
                    "建議使用最新版 Chrome 或 Edge。"
                );
                return;
            }

            const allowed =
                await ensureMicrophonePermission();

            if (!allowed) {
                alert(
                    "咪高峰權限未允許，無法開始語音輸入。"
                );
                return;
            }

            const item = type === "node"
                ? nodes.find((node) => node.id === id)
                : findBoxById(id);

            if (!item) return;

            const originalSnapshot = captureState();
            const originalText = item.text || "";

            const recognition = new SpeechRecognition();

            recognition.lang = "zh-HK";
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.maxAlternatives = 1;

            activeRecognition = recognition;
            activeSpeechButton = button;

            speechSession = {
                type,
                id,
                item,
                originalSnapshot,
                originalText,
                changed: false
            };

            button.classList.add("listening");
            button.textContent = "⏹";
            button.title = "停止語音輸入";

            recognition.onresult = (event) => {
                let finalText = "";
                let interimText = "";

                for (
                    let index = 0;
                    index < event.results.length;
                    index++
                ) {
                    const transcript =
                        event.results[index][0].transcript;

                    if (event.results[index].isFinal) {
                        finalText += transcript;
                    } else {
                        interimText += transcript;
                    }
                }

                const separator =
                    originalText &&
                    !/\s$/.test(originalText)
                        ? " "
                        : "";

                item.text =
                    originalText +
                    separator +
                    finalText +
                    interimText;

                speechSession.changed =
                    item.text !== originalText;

                updateItemTextDisplay(type, id, item.text);
                autoFitHeight(type, id, false);
                drawLines();
            };

            recognition.onerror = (event) => {
                console.warn(
                    "Speech recognition error:",
                    event.error
                );

                if (event.error === "not-allowed") {
                    updatePermissionStatus(
                        "denied",
                        "❌ 語音辨識權限被拒絕"
                    );
                }
            };

            recognition.onend = () => {
                finishSpeechSession();
            };

            try {
                recognition.start();
            } catch (error) {
                console.error(error);
                finishSpeechSession();
            }
        }

        function stopSpeechRecognition(commit = true) {
            if (!activeRecognition) {
                if (!commit && speechSession) {
                    speechSession.item.text =
                        speechSession.originalText;
                }

                return;
            }

            try {
                activeRecognition.stop();
            } catch (error) {
                console.warn(error);
            }
        }

        function finishSpeechSession() {
            if (activeSpeechButton) {
                activeSpeechButton.classList.remove("listening");
                activeSpeechButton.textContent = "🎤";
                activeSpeechButton.title =
                    "語音輸入；再按一次停止";
            }

            if (
                speechSession &&
                speechSession.changed
            ) {
                pushHistorySnapshot(
                    speechSession.originalSnapshot
                );
            }

            activeRecognition = null;
            activeSpeechButton = null;
            speechSession = null;
        }

        function updateItemTextDisplay(type, id, text) {
            const element = document.getElementById(
                type === "node" ? `node-${id}` : `box-${id}`
            );

            if (!element) return;

            const textElement = element.querySelector(
                type === "node"
                    ? ".node-text"
                    : ".link-box-text"
            );

            if (textElement) {
                textElement.textContent = text;
            }
        }

        /* =========================
           Colour picker
        ========================= */

        function openPickerForNode(event, nodeId) {
            commitPickerHistory();

            const node = nodes.find(
                (item) => item.id === nodeId
            );

            if (!node) return;

            activePickerTarget = {
                type: "node",
                id: nodeId
            };

            popPicker(event, node);
        }

        function openPickerForBox(event, boxId) {
            commitPickerHistory();

            const box = findBoxById(boxId);

            if (!box) return;

            activePickerTarget = {
                type: "box",
                id: boxId
            };

            popPicker(event, box);
        }

        function popPicker(event, item) {
            pickerStartSnapshot = captureState();

            document.getElementById("picker-c1").value =
                item.color1 || "#1565c0";

            document.getElementById("picker-c2").value =
                item.color2 || "#1e88e5";

            document.getElementById("picker-angle").value =
                item.deg ?? 135;

            document.getElementById("picker-alpha").value =
                Math.round((item.opacity ?? 1) * 100);

            document
                .querySelectorAll(".picker-tab")
                .forEach((tab) => {
                    tab.classList.remove("active");
                });

            const mode = item.colorType || "solid";

            document
                .getElementById(`tab-${mode}`)
                ?.classList.add("active");

            adobePicker.style.display = "flex";

            const pickerWidth = 230;
            const pickerHeight = 250;

            const left = Math.min(
                window.innerWidth - pickerWidth - 10,
                event.clientX + 10
            );

            const top = Math.min(
                window.innerHeight - pickerHeight - 10,
                Math.max(10, event.clientY - 10)
            );

            adobePicker.style.left =
                `${Math.max(10, left)}px`;

            adobePicker.style.top =
                `${Math.max(10, top)}px`;
        }

        function closeAdobePicker() {
            commitPickerHistory();

            adobePicker.style.display = "none";
            activePickerTarget = null;
            pickerStartSnapshot = null;
        }

        function commitPickerHistory() {
            if (!pickerStartSnapshot) return;

            pushHistorySnapshot(pickerStartSnapshot);
            pickerStartSnapshot = null;
        }

        function getActivePickerItem() {
            if (!activePickerTarget) return null;

            return activePickerTarget.type === "node"
                ? nodes.find(
                    (node) =>
                        node.id === activePickerTarget.id
                )
                : findBoxById(activePickerTarget.id);
        }

        function applyColorPicker() {
            const item = getActivePickerItem();

            if (!item) return;

            item.color1 =
                document.getElementById("picker-c1").value;

            item.color2 =
                document.getElementById("picker-c2").value;

            item.deg = Number(
                document.getElementById("picker-angle").value
            );

            item.opacity =
                Number(
                    document.getElementById("picker-alpha").value
                ) / 100;

            const element = document.getElementById(
                activePickerTarget.type === "node"
                    ? `node-${item.id}`
                    : `box-${item.id}`
            );

            if (element) {
                applyStyle(element, item);
            }

            drawLines();
        }

        function setPickerMode(mode) {
            document
                .querySelectorAll(".picker-tab")
                .forEach((tab) => {
                    tab.classList.remove("active");
                });

            document
                .getElementById(`tab-${mode}`)
                ?.classList.add("active");

            const item = getActivePickerItem();

            if (!item) return;

            item.colorType = mode;
            applyColorPicker();
        }

        function applyStyle(element, item) {
            const alpha = item.opacity ?? 1;

            const color1 = hexToRgba(
                item.color1 || "#1565c0",
                alpha
            );

            const color2 = hexToRgba(
                item.color2 || "#1e88e5",
                alpha
            );

            const degree = item.deg ?? 135;

            if (item.colorType === "sharp") {
                element.style.background =
                    `linear-gradient(
                        ${degree}deg,
                        ${color1} 50%,
                        ${color2} 50%
                    )`;
            } else if (item.colorType === "gradient") {
                element.style.background =
                    `linear-gradient(
                        ${degree}deg,
                        ${color1},
                        ${color2}
                    )`;
            } else {
                element.style.background = color1;
            }

            element.style.border =
                `2px solid ${item.color1 || "#1565c0"}`;
        }

        function hexToRgba(hex, alpha) {
            let value = String(hex).replace("#", "");

            if (value.length === 3) {
                value = value
                    .split("")
                    .map((character) => character + character)
                    .join("");
            }

            const number = parseInt(value, 16);

            return `rgba(
                ${(number >> 16) & 255},
                ${(number >> 8) & 255},
                ${number & 255},
                ${alpha}
            )`;
        }

        /* =========================
           In-place menu
        ========================= */

        function toggleInplaceMenu(id) {
            const target =
                document.getElementById(`menu-${id}`);

            const wasActive =
                target?.classList.contains("active");

            document
                .querySelectorAll(".inplace-action-menu")
                .forEach((menu) => {
                    menu.classList.remove("active");
                });

            if (!wasActive) {
                target?.classList.add("active");
            }
        }

        /* =========================
           Canvas events
        ========================= */

        function setupCanvasEvents() {
            canvasArea.addEventListener("mousedown", (event) => {
                document
                    .querySelectorAll(".inplace-action-menu")
                    .forEach((menu) => {
                        menu.classList.remove("active");
                    });

                if (!adobePicker.contains(event.target)) {
                    closeAdobePicker();
                }

                const isCanvasBackground =
                    event.target === canvasArea ||
                    event.target === treeCanvas ||
                    event.target === svg ||
                    event.target.tagName?.toLowerCase() === "svg";

                if (
                    (linkMode || relationshipMode) &&
                    isCanvasBackground
                ) {
                    cancelLinkMode();
                    cancelRelationshipMode();
                    return;
                }

                if (!isCanvasBackground) return;

                finishCurrentEditing();

                selectedId = null;
                selectedBoxId = null;

                document
                    .querySelectorAll(".node, .link-box")
                    .forEach((element) => {
                        element.classList.remove("selected");
                    });

                isPanning = true;
                canvasArea.classList.add("panning");

                panStartX = event.clientX - tx;
                panStartY = event.clientY - ty;
            });

            window.addEventListener("mousemove", (event) => {
                const rect =
                    canvasArea.getBoundingClientRect();

                const mouseX =
                    (event.clientX - rect.left - tx) / scale;

                const mouseY =
                    (event.clientY - rect.top - ty) / scale;

                if (
                    linkMode &&
                    linkFromId !== null &&
                    tempLinkLine
                ) {
                    tempLinkLine.setAttribute("x2", mouseX);
                    tempLinkLine.setAttribute("y2", mouseY);
                }

                if (resizeTarget) {
                    updateResize(event);
                    return;
                }

                if (dragTarget) {
                    updateDrag(mouseX, mouseY, event);
                    return;
                }

                if (isPanning) {
                    tx = event.clientX - panStartX;
                    ty = event.clientY - panStartY;

                    updateTransform();
                }
            });

            window.addEventListener("mouseup", () => {
                finishGesture();

                isPanning = false;
                canvasArea.classList.remove("panning");
            });

            canvasArea.addEventListener(
                "wheel",
                (event) => {
                    event.preventDefault();

                    const rect =
                        canvasArea.getBoundingClientRect();

                    const pointerX =
                        event.clientX - rect.left;

                    const pointerY =
                        event.clientY - rect.top;

                    const worldX =
                        (pointerX - tx) / scale;

                    const worldY =
                        (pointerY - ty) / scale;

                    const factor =
                        event.deltaY < 0 ? 1.1 : 0.9;

                    const newScale = Math.max(
                        0.2,
                        Math.min(3, scale * factor)
                    );

                    tx =
                        pointerX -
                        worldX * newScale;

                    ty =
                        pointerY -
                        worldY * newScale;

                    scale = newScale;

                    updateTransform();
                },
                { passive: false }
            );
        }

        /* =========================
           Keyboard shortcuts
        ========================= */

        function setupKeyboardShortcuts() {
            window.addEventListener("keydown", (event) => {
                const activeTag =
                    document.activeElement?.tagName?.toLowerCase();

                if (
                    activeTag === "input" ||
                    activeTag === "textarea" ||
                    activeTag === "select"
                ) {
                    return;
                }

                if (editingTarget) return;

                if (
                    (event.ctrlKey || event.metaKey) &&
                    event.key.toLowerCase() === "z"
                ) {
                    event.preventDefault();

                    if (event.shiftKey) {
                        redo();
                    } else {
                        undo();
                    }

                    return;
                }

                if (
                    (event.ctrlKey || event.metaKey) &&
                    event.key.toLowerCase() === "y"
                ) {
                    event.preventDefault();
                    redo();
                    return;
                }

                if (event.key === "Tab") {
                    event.preventDefault();

                    if (selectedId !== null) {
                        addChildTo(selectedId, true);
                    }

                    return;
                }

                if (event.key === "Enter") {
                    event.preventDefault();

                    if (selectedId !== null) {
                        addSiblingTo(selectedId, true);
                    } else if (selectedBoxId !== null) {
                        startTextEdit("box", selectedBoxId);
                    }

                    return;
                }

                if (
                    event.key === "Delete" ||
                    event.key === "Backspace"
                ) {
                    event.preventDefault();
                    deleteSelected();
                    return;
                }

                if (event.key === "Escape") {
                    cancelLinkMode();
                    cancelRelationshipMode();
                    closeAdobePicker();
                }
            });
        }

        /* =========================
           Geometry/helpers
        ========================= */

        function setElementGeometry(element, item) {
            element.style.left = `${item.x}px`;
            element.style.top = `${item.y}px`;
            element.style.width = `${item.width}px`;
            element.style.height = `${item.height}px`;
        }

        function stopInteractiveEvent(event) {
            event.stopPropagation();
        }

        function isInteractiveTarget(target) {
            return Boolean(
                target.closest(
                    "button, input, textarea, select, " +
                    ".resize-handle, .inplace-action-menu"
                )
            );
        }

        /* =========================
           Zoom
        ========================= */

        function updateTransform() {
            treeCanvas.style.transform =
                `translate(${tx}px, ${ty}px) scale(${scale})`;
        }

        function zoomIn() {
            scale = Math.min(3, scale * 1.2);
            updateTransform();
        }

        function zoomOut() {
            scale = Math.max(0.2, scale * 0.8);
            updateTransform();
        }

        function backToCenter() {
            tx = -4000 + canvasArea.offsetWidth / 2;
            ty = -4000 + canvasArea.offsetHeight / 2;
            scale = 1;

            updateTransform();
        }

        /* =========================
           Import / Export
        ========================= */

        function exportJSON() {
            finishCurrentEditing();

            const data = {
                version: 2,
                exportedAt: new Date().toISOString(),
                nodes,
                crossLinks,
                nextId,
                nextLinkId,
                nextBoxId
            };

            const blob = new Blob(
                [JSON.stringify(data, null, 2)],
                { type: "application/json;charset=utf-8" }
            );

            const url = URL.createObjectURL(blob);
            const anchor = document.createElement("a");

            anchor.href = url;
            anchor.download = "mindmap-pro.json";

            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();

            URL.revokeObjectURL(url);
        }

        function importJSON() {
            finishCurrentEditing();

            const input = document.createElement("input");

            input.type = "file";
            input.accept = ".json,application/json";

            input.addEventListener("change", () => {
                const file = input.files?.[0];

                if (!file) return;

                const reader = new FileReader();

                reader.addEventListener("load", () => {
                    try {
                        const data = JSON.parse(
                            String(reader.result)
                        );

                        const snapshot = captureState();

                        restoreState({
                            nodes: data.nodes || [],
                            crossLinks: data.crossLinks || [],
                            nextId:
                                Number.isFinite(data.nextId)
                                    ? data.nextId
                                    : undefined,
                            nextLinkId:
                                Number.isFinite(data.nextLinkId)
                                    ? data.nextLinkId
                                    : undefined,
                            nextBoxId:
                                Number.isFinite(data.nextBoxId)
                                    ? data.nextBoxId
                                    : undefined
                        });

                        pushHistorySnapshot(snapshot);
                    } catch (error) {
                        console.error(error);

                        alert(
                            "匯入失敗：JSON 檔案格式不正確。"
                        );
                    }
                });

                reader.readAsText(file);
            });

            input.click();
        }
    </script>

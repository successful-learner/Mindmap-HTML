<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Mind Map Pro - 全功能增強版 (GAS & 媒體支援)</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            color-scheme: light;
        }

        body {
            --bg: #f5f5f5;
            --sidebar-bg: #ffffff;
            --sidebar-border: #e0e0e0;
            --text: #1a1a1a;
            --text-sub: #666666;
            --btn-bg: #f0f0f0;
            --btn-border: #dddddd;
            --btn-hover: #e4e4e4;
            --input-bg: #ffffff;
            --input-focus: #4285f4;
            --canvas-bg: #fafafa;
            --node-shadow: rgba(0, 0, 0, 0.14);
            --accent: #4285f4;

            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            position: relative;
            background: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        button, input, textarea, select {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        /* 12 款畫布背景樣式 */
        #canvas-area.bg-default { background: #fafafa; }
        #canvas-area.bg-night { background: #1a1a2e; }
        #canvas-area.bg-beige { background: #f5f2eb; }
        #canvas-area.bg-light-green { background: #eef7ee; }
        #canvas-area.bg-light-blue { background: #eef5fc; }
        #canvas-area.bg-grid { 
            background-color: #f0f3f6; 
            background-image: linear-gradient(#e1e6ed 1px, transparent 1px), linear-gradient(90deg, #e1e6ed 1px, transparent 1px);
            background-size: 20px 20px;
        }
        #canvas-area.bg-blueprint { 
            background-color: #1e3a5f; 
            background-image: linear-gradient(rgba(255,255,255,0.15) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.15) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        #canvas-area.bg-charcoal { background: #222222; }
        #canvas-area.bg-sunset { background: #fff5eb; }
        #canvas-area.bg-lavender { background: #f3f0f9; }
        #canvas-area.bg-mint { background: #e8f8f5; }
        #canvas-area.bg-white { background: #ffffff; }

        /* Sidebar */
        .sidebar-toggle-btn {
            position: absolute;
            top: 15px;
            left: 270px;
            z-index: 301;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--sidebar-bg);
            border: 1px solid var(--sidebar-border);
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px var(--node-shadow);
            transition: left 0.3s, transform 0.2s;
        }

        .sidebar-toggle-btn:hover { transform: scale(1.06); }

        .sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--sidebar-border);
            display: flex;
            flex-direction: column;
            z-index: 300;
            flex-shrink: 0;
            overflow-y: auto;
            transition: margin-left 0.3s;
        }

        .sidebar.collapsed { margin-left: -260px; }
        .sidebar.collapsed + .sidebar-toggle-btn { left: 10px; }

        .sidebar-header {
            padding: 18px;
            border-bottom: 1px solid var(--sidebar-border);
        }

        .sidebar-header h1 {
            color: var(--text);
            font-size: 18px;
            font-weight: 700;
        }

        .sidebar-header p {
            margin-top: 4px;
            color: var(--text-sub);
            font-size: 11px;
            line-height: 1.5;
        }

        .sidebar-section {
            padding: 14px 18px;
            border-bottom: 1px solid var(--sidebar-border);
        }

        .sidebar-section h3 {
            color: var(--text-sub);
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        /* 置中 Multi Tree Checkbox */
        .multi-tree-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px;
            background: rgba(66, 133, 244, 0.08);
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
        }

        .multi-tree-container input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .action-btn {
            width: 100%;
            min-height: 34px;
            padding: 6px 10px;
            margin-bottom: 6px;
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: 8px;
            color: var(--text);
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            text-align: left;
        }

        .action-btn:hover { background: var(--btn-hover); }

        .style-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            margin-bottom: 6px;
            font-size: 12px;
        }

        .style-row select, .style-row input {
            padding: 3px 6px;
            border-radius: 4px;
            border: 1px solid var(--btn-border);
            background: var(--input-bg);
        }

        .permission-status {
            padding: 8px 10px;
            border-radius: 8px;
            background: #f5f5f5;
            color: var(--text-sub);
            font-size: 11px;
            line-height: 1.5;
        }

        .permission-status.granted { background: #e8f5e9; color: #1b5e20; }
        .permission-status.denied { background: #ffebee; color: #b71c1c; }

        /* Canvas */
        #canvas-area {
            flex: 1;
            position: relative;
            overflow: hidden;
            cursor: grab;
        }

        #canvas-area.panning { cursor: grabbing; }
        #canvas-area.linking { cursor: crosshair !important; }

        #tree-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 8000px; height: 8000px;
            transform-origin: 0 0;
        }

        #lines-svg {
            position: absolute;
            top: 0; left: 0;
            width: 8000px; height: 8000px;
            pointer-events: none;
            z-index: 5;
            overflow: visible;
        }

        .branch-line { stroke-width: 2.5; fill: none; }
        .cross-link { stroke-width: 2; fill: none; stroke-dasharray: 6 4; }

        /* Node / Link Box */
        .node, .link-box {
            position: absolute;
            user-select: none;
            touch-action: none;
            overflow: visible;
        }

        .node-content, .link-box-content {
            width: 100%; height: 100%;
            min-width: 0; min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: auto;
            scrollbar-width: thin;
        }

        /* 媒體嵌入樣式 */
        .node-content img, .node-content video, .node-content iframe {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 6px;
            display: block;
            margin: 4px auto;
            pointer-events: auto;
        }

        .node-content iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .node-text, .link-box-text {
            display: block;
            width: 100%;
            max-width: 100%;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            word-break: break-word;
            text-align: center;
            line-height: 1.4;
            pointer-events: none;
        }

        .node.editing .node-content, .link-box.editing .link-box-content { overflow: hidden; }

        .text-editor {
            width: 100%; height: 100%;
            min-width: 0; min-height: 0;
            resize: none; outline: none;
            border-radius: 5px; padding: 4px 6px;
            line-height: 1.4; text-align: left;
            white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word;
            overflow: auto; user-select: text; touch-action: auto;
        }

        .node {
            min-width: 90px; min-height: 40px;
            padding: 8px 18px; border-radius: 10px;
            color: #ffffff; font-size: 14px;
            cursor: move; box-shadow: 0 4px 12px var(--node-shadow);
            z-index: 20;
        }

        .node.selected { box-shadow: 0 0 0 3px var(--input-focus), 0 8px 20px var(--node-shadow); }
        .node.linking-source { animation: pulse 0.8s infinite alternate; }

        .link-box {
            min-width: 80px; min-height: 32px;
            padding: 5px 9px; border-radius: 7px;
            color: #333333; font-size: 12px;
            cursor: move; box-shadow: 0 2px 9px rgba(0, 0, 0, 0.16);
            z-index: 25;
        }

        .link-box.selected { box-shadow: 0 0 0 3px rgba(255, 152, 0, 0.6), 0 5px 14px rgba(0, 0, 0, 0.2); }

        @keyframes pulse {
            from { transform: scale(1); box-shadow: 0 0 0 3px #ff9800; }
            to { transform: scale(1.06); box-shadow: 0 0 0 8px rgba(255, 152, 0, 0.4); }
        }

        /* Control Handles */
        .resize-handle { position: absolute; z-index: 45; display: none; }
        .node:hover .resize-handle, .node.selected .resize-handle,
        .link-box:hover .resize-handle, .link-box.selected .resize-handle { display: block; }

        .resize-handle.n, .resize-handle.s { left: 12px; right: 12px; height: 7px; cursor: ns-resize; }
        .resize-handle.n { top: -4px; } .resize-handle.s { bottom: -4px; }
        .resize-handle.e, .resize-handle.w { top: 10px; bottom: 10px; width: 7px; cursor: ew-resize; }
        .resize-handle.e { right: -4px; } .resize-handle.w { left: -4px; }

        .resize-handle.ne, .resize-handle.nw, .resize-handle.se, .resize-handle.sw {
            width: 11px; height: 11px; border-radius: 3px;
            background: #ffffff; border: 2px solid #4285f4;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.22);
        }
        .link-box .resize-handle.ne, .link-box .resize-handle.nw,
        .link-box .resize-handle.se, .link-box .resize-handle.sw { border-color: #ff9800; }

        .resize-handle.ne { top: -6px; right: -6px; cursor: nesw-resize; }
        .resize-handle.nw { top: -6px; left: -6px; cursor: nwse-resize; }
        .resize-handle.se { right: -6px; bottom: -6px; cursor: nwse-resize; }
        .resize-handle.sw { left: -6px; bottom: -6px; cursor: nesw-resize; }

        .node-quick-add {
            position: absolute; right: -30px; top: 50%;
            transform: translateY(-50%) scale(0.8);
            width: 25px; height: 25px; border-radius: 50%;
            background: var(--accent); color: #ffffff;
            border: none; font-size: 17px; font-weight: bold;
            line-height: 23px; text-align: center; cursor: pointer;
            opacity: 0; pointer-events: none; transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25); z-index: 50;
        }

        .node:hover .node-quick-add, .node.selected .node-quick-add { opacity: 1; pointer-events: auto; transform: translateY(-50%) scale(1); }

        .inplace-menu-trigger, .box-color-trigger, .speech-btn, .box-unlink-btn {
            position: absolute; width: 22px; height: 22px;
            border-radius: 50%; background: var(--sidebar-bg);
            border: 1px solid var(--sidebar-border); color: var(--text);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2); z-index: 55;
        }

        .inplace-menu-trigger, .box-color-trigger { top: -10px; right: -10px; font-size: 11px; }
        .box-unlink-btn { top: -10px; left: -10px; font-size: 11px; color: #d32f2f; }
        .speech-btn { left: -10px; bottom: -10px; font-size: 11px; }

        .inplace-action-menu {
            position: absolute; top: -48px; left: 50%;
            transform: translateX(-50%); background: var(--sidebar-bg);
            border: 1px solid var(--sidebar-border); border-radius: 20px;
            padding: 4px 8px; display: none; gap: 4px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25); z-index: 100; white-space: nowrap;
        }
        .inplace-action-menu.active { display: flex; align-items: center; }

        .inplace-btn {
            background: var(--btn-bg); border: 1px solid var(--btn-border);
            color: var(--text); width: 27px; height: 27px;
            border-radius: 50%; cursor: pointer; font-size: 12px;
            display: flex; align-items: center; justify-content: center;
        }

        /* 擴充 Adobe 格式顏色面板 (HEX, RGB, HSB, CMYK, LAB, RGB Code) */
        .adobe-picker-popover {
            position: absolute; z-index: 500; width: 280px;
            background: var(--sidebar-bg); border: 1px solid var(--sidebar-border);
            border-radius: 12px; padding: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: none; flex-direction: column; gap: 8px; font-size: 11px; color: var(--text);
        }

        .adobe-picker-header { display: flex; justify-content: space-between; font-weight: 600; font-size: 13px; }
        .picker-tabs { display: flex; gap: 4px; background: var(--btn-bg); padding: 2px; border-radius: 6px; }
        .picker-tab { flex: 1; text-align: center; padding: 4px 0; font-size: 10px; cursor: pointer; border-radius: 4px; color: var(--text-sub); }
        .picker-tab.active { background: var(--accent); color: #ffffff; }

        .picker-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
        .picker-row input[type="text"] { width: 150px; padding: 2px 4px; border: 1px solid var(--btn-border); border-radius: 4px; }
        .picker-row input[type="number"] { width: 45px; padding: 2px 4px; border: 1px solid var(--btn-border); border-radius: 4px; }

        .zoom-controls {
            position: absolute; top: 50%; right: 20px;
            transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; z-index: 200;
        }

        .zoom-btn {
            width: 36px; height: 36px; background: var(--sidebar-bg);
            border: 1px solid var(--sidebar-border); border-radius: 8px;
            color: var(--text); cursor: pointer; box-shadow: 0 2px 7px rgba(0, 0, 0, 0.08);
        }

        .relationship-mode-banner {
            position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
            z-index: 260; display: none; max-width: min(600px, calc(100vw - 40px));
            padding: 8px 16px; border: 2px solid #9c27b0; border-radius: 22px;
            background: rgba(255, 255, 255, 0.98); color: #4a148c;
            font-size: 13px; font-weight: 600; text-align: center;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.18);
        }
        .relationship-mode-banner.active { display: flex; align-items: center; gap: 10px; }

        .banner-cancel-btn {
            background: #d32f2f; color: #fff; border: none;
            padding: 4px 10px; border-radius: 12px; cursor: pointer; font-size: 11px;
        }
    </style>
</head>

<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h1>🌿 Mind Map Pro</h1>
            <p>雙擊文字編輯、多樹架構、多媒體嵌入與 Google Drive 同步版</p>
        </div>

        <div class="sidebar-section">
            <!-- 多樹模式 Multi Tree 置中 Checkbox -->
            <div class="multi-tree-container">
                <input type="checkbox" id="multi-tree-toggle" onchange="toggleMultiTree(this.checked)">
                <label for="multi-tree-toggle">啟用 Multi Tree 多樹模式</label>
            </div>

            <h3>快捷思考與節點指令</h3>

            <button class="action-btn" onclick="addRootNode()">
                🌳 新增獨立根節點
            </button>

            <button class="action-btn" onclick="addChildToSelected(true)">
                ＋ 子節點（Tab）
            </button>

            <button class="action-btn" onclick="addSiblingToSelected(true)">
                ↔ 同級節點（Enter）
            </button>

            <button class="action-btn" onclick="addStandaloneLinkBox()">
                📦 新增獨立 Link Box
            </button>

            <button class="action-btn" onclick="startReparentSelected()">
                ⇆ 轉父節點
            </button>

            <button class="action-btn" onclick="startUnlinkSelected()">
                ⛓ 取消兩點連結
            </button>

            <button class="action-btn" onclick="cancelAllModes()" style="color:#d32f2f;">
                🛑 結束 Link／取消連線模式
            </button>

            <button class="action-btn" onclick="deleteSelected()">
                ✕ 刪除所選項目（Delete）
            </button>

            <div style="display:flex; gap:6px; margin-top:6px;">
                <button class="action-btn" onclick="undo()">⟲ Undo</button>
                <button class="action-btn" onclick="redo()">⟳ Redo</button>
            </div>
        </div>

        <!-- 12 款畫布背景選擇 -->
        <div class="sidebar-section">
            <h3>畫布背景 (12 款)</h3>
            <select id="bg-selector" class="action-btn" onchange="changeCanvasBackground(this.value)">
                <option value="bg-default">1. 預設淺灰 (Default)</option>
                <option value="bg-night">2. 夜間極客 (Night)</option>
                <option value="bg-beige">3. 復古米色 (Beige)</option>
                <option value="bg-light-green">4. 護眼淺綠 (Light Green)</option>
                <option value="bg-light-blue">5. 舒適淺藍 (Light Blue)</option>
                <option value="bg-grid">6. 工程網格 (Grid)</option>
                <option value="bg-blueprint">7. 建築藍圖 (Blueprint)</option>
                <option value="bg-charcoal">8. 深色焦炭 (Charcoal)</option>
                <option value="bg-sunset">9. 日落暖黃 (Warm Sunset)</option>
                <option value="bg-lavender">10. 薰衣草紫 (Lavender)</option>
                <option value="bg-mint">11. 清新薄荷 (Mint)</option>
                <option value="bg-white">12. 純白無瑕 (Pure White)</option>
            </select>
        </div>

        <!-- 字體與排版設定 -->
        <div class="sidebar-section">
            <h3>文字與排版設定</h3>
            <div class="style-row">
                <span>字體:</span>
                <select id="font-family-select" onchange="applyTextStyle('fontFamily', this.value)">
                    <option value="sans-serif">System Sans</option>
                    <option value="Arial, sans-serif">Arial</option>
                    <option value="'Georgia', serif">Georgia</option>
                    <option value="'Courier New', monospace">Monospace</option>
                    <option value="'Microsoft JhengHei', sans-serif">微軟正黑體</option>
                </select>
            </div>
            <div class="style-row">
                <span>字級:</span>
                <input type="number" id="font-size-input" value="14" min="10" max="48" onchange="applyTextStyle('fontSize', this.value + 'px')">
            </div>
            <div class="style-row">
                <span>字重:</span>
                <select id="font-weight-select" onchange="applyTextStyle('fontWeight', this.value)">
                    <option value="normal">一般 (Normal)</option>
                    <option value="bold">粗體 (Bold)</option>
                    <option value="300">細體 (Light)</option>
                </select>
            </div>
            <div class="style-row">
                <span>文字顏色:</span>
                <input type="color" id="text-color-input" value="#ffffff" onchange="applyTextStyle('color', this.value)">
            </div>
        </div>

        <div class="sidebar-section">
            <h3>語音輸入</h3>
            <button class="action-btn" onclick="requestPermanentMicrophonePermission()">🎤 啟用咪高峰權限</button>
            <div class="permission-status" id="permission-status">正在檢查咪高峰權限……</div>
        </div>

        <div class="sidebar-section">
            <h3>Google Drive 雲端同步</h3>
            <button class="action-btn" onclick="saveToDrive()">☁️ 儲存至 Google Drive</button>
            <button class="action-btn" onclick="loadFromDrive()">📂 從 Google Drive 載入</button>
        </div>

        <div class="sidebar-section">
            <h3>檔案備份 (本地)</h3>
            <button class="action-btn" onclick="exportJSON()">↓ 匯出 JSON</button>
            <button class="action-btn" onclick="importJSON()">↑ 匯入 JSON</button>
        </div>
    </div>

    <button class="sidebar-toggle-btn" id="sidebar-toggle-btn" onclick="toggleSidebar()" title="開啟／收起側欄">◀</button>

    <div id="canvas-area" class="bg-default">
        <div class="relationship-mode-banner" id="relationship-mode-banner">
            <span id="banner-text">模式提示文字</span>
            <button class="banner-cancel-btn" onclick="cancelAllModes()">結束 / 取消</button>
        </div>

        <div id="tree-canvas">
            <svg id="lines-svg">
                <line id="temp-link-line" x1="0" y1="0" x2="0" y2="0" stroke="#ff9800" stroke-width="2.5" stroke-dasharray="6,4" style="display:none;"></line>
            </svg>
        </div>

        <div class="zoom-controls">
            <button class="zoom-btn" onclick="zoomIn()" title="放大">＋</button>
            <button class="zoom-btn" onclick="zoomOut()" title="縮小">−</button>
            <button class="zoom-btn" onclick="backToCenter()" title="返回中心">⟲</button>
        </div>
    </div>

    <!-- Adobe 格式調色盤 (HEX, RGB, HSB, CMYK, LAB, RGB Code) -->
    <div class="adobe-picker-popover" id="adobe-picker">
        <div class="adobe-picker-header">
            <span>🎨 Adobe 格式調色盤</span>
            <button style="background:none; border:none; color:var(--text); cursor:pointer;" onclick="closeAdobePicker()">✕</button>
        </div>

        <div class="picker-tabs">
            <div class="picker-tab active" id="tab-solid" onclick="setPickerMode('solid')">單色</div>
            <div class="picker-tab" id="tab-gradient" onclick="setPickerMode('gradient')">漸變</div>
            <div class="picker-tab" id="tab-sharp" onclick="setPickerMode('sharp')">尖邊</div>
        </div>

        <div class="picker-row">
            <span>主色 picker:</span>
            <input type="color" id="picker-c1" value="#1565c0" oninput="onColorPickerChange()">
            <span>次色:</span>
            <input type="color" id="picker-c2" value="#1e88e5" oninput="onColorPickerChange()">
        </div>

        <div class="picker-row">
            <span>HEX:</span>
            <input type="text" id="color-hex" value="#1565C0" onchange="updateFromHex(this.value)">
        </div>

        <div class="picker-row">
            <span>RGB Code:</span>
            <input type="text" id="color-rgb-code" value="rgb(21, 101, 192)" readonly>
        </div>

        <div class="picker-row">
            <span>RGB:</span>
            <input type="number" id="rgb-r" min="0" max="255" value="21" onchange="updateFromRgb()">
            <input type="number" id="rgb-g" min="0" max="255" value="101" onchange="updateFromRgb()">
            <input type="number" id="rgb-b" min="0" max="255" value="192" onchange="updateFromRgb()">
        </div>

        <div class="picker-row">
            <span>HSB:</span>
            <input type="number" id="hsb-h" min="0" max="360" value="212" onchange="updateFromHsb()">°
            <input type="number" id="hsb-s" min="0" max="100" value="89" onchange="updateFromHsb()">%
            <input type="number" id="hsb-b" min="0" max="100" value="75" onchange="updateFromHsb()">%
        </div>

        <div class="picker-row">
            <span>CMYK:</span>
            <input type="number" id="cmyk-c" min="0" max="100" value="89" readonly>%
            <input type="number" id="cmyk-m" min="0" max="100" value="47" readonly>%
            <input type="number" id="cmyk-y" min="0" max="100" value="0" readonly>%
            <input type="number" id="cmyk-k" min="0" max="100" value="25" readonly>%
        </div>

        <div class="picker-row">
            <span>LAB:</span>
            <input type="number" id="lab-l" value="43" readonly>
            <input type="number" id="lab-a" value="9" readonly>
            <input type="number" id="lab-b" value="-55" readonly>
        </div>

        <div class="picker-row">
            <span>漸變角度:</span>
            <input type="range" id="picker-angle" min="0" max="360" value="135" style="width:100px;" oninput="applyColorPicker()">
        </div>

        <div class="picker-row">
            <span>不透明度:</span>
            <input type="range" id="picker-alpha" min="10" max="100" value="100" style="width:100px;" oninput="applyColorPicker()">
        </div>
    </div>

    <script>
        "use strict";

        let nodes = [];
        let crossLinks = [];
        let standaloneBoxes = [];

        let nextId = 0;
        let nextLinkId = 0;
        let nextBoxId = 0;

        let selectedId = null;
        let selectedBoxId = null;
        let clipboardData = null;

        let multiTreeEnabled = false;
        let currentCanvasBg = "bg-default";

        let scale = 1;
        let tx = 0;
        let ty = 0;

        let undoStack = [];
        let redoStack = [];
        let isRestoringHistory = false;

        let isPanning = false;
        let panStartX = 0, panStartY = 0;
        let dragTarget = null, resizeTarget = null, gestureSnapshot = null;
        let dragMouseX = 0, dragMouseY = 0, gestureStartClientX = 0, gestureStartClientY = 0;

        let linkMode = false, linkFromId = null;
        let relationshipMode = null, relationshipSourceId = null;
        let editingTarget = null, activePickerTarget = null, pickerStartSnapshot = null;

        let activeRecognition = null, activeSpeechButton = null, speechSession = null;

        const MIN_NODE_WIDTH = 90, MIN_NODE_HEIGHT = 40;
        const MIN_BOX_WIDTH = 80, MIN_BOX_HEIGHT = 32;

        const canvasArea = document.getElementById("canvas-area");
        const treeCanvas = document.getElementById("tree-canvas");
        const svg = document.getElementById("lines-svg");
        const tempLinkLine = document.getElementById("temp-link-line");
        const adobePicker = document.getElementById("adobe-picker");
        const permissionStatus = document.getElementById("permission-status");
        const relationshipModeBanner = document.getElementById("relationship-mode-banner");

        window.addEventListener("load", () => {
            const cx = 4000, cy = 4000;
            const rootId = createNode("中心主題", cx - 65, cy - 22, null, false, false);

            tx = -cx + canvasArea.offsetWidth / 2;
            ty = -cy + canvasArea.offsetHeight / 2;

            updateTransform();
            setupCanvasEvents();
            setupKeyboardShortcuts();
            checkMicrophonePermission();

            selectNode(rootId);
            drawLines();
        });

        /* ================= Google Apps Script (GAS) 雲端儲存與載入 ================= */
        function saveToDrive() {
            finishCurrentEditing();
            const data = captureState();
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(res => alert("✅ 已成功儲存至 Google Drive！"))
                    .withFailureHandler(err => alert("❌ 儲存失敗：" + err))
                    .saveMindMapToDrive(data);
            } else {
                alert("⚠️ 目前不在 Apps Script 環境中運行，預設儲存至 LocalStorage。");
                localStorage.setItem("mindmap_backup", data);
            }
        }

        function loadFromDrive() {
            finishCurrentEditing();
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(data => {
                        if (data) {
                            restoreState(JSON.parse(data));
                            alert("✅ 已成功從 Google Drive 載入！");
                        } else {
                            alert("⚠️ Google Drive 尚未有備份紀錄。");
                        }
                    })
                    .withFailureHandler(err => alert("❌ 載入失敗：" + err))
                    .loadMindMapFromDrive();
            } else {
                const data = localStorage.getItem("mindmap_backup");
                if (data) {
                    restoreState(JSON.parse(data));
                    alert("✅ 已從 LocalStorage 載入！");
                } else {
                    alert("⚠️ 找不到本地備份。");
                }
            }
        }

        /* Multi Tree 模式切換 */
        function toggleMultiTree(enabled) {
            multiTreeEnabled = enabled;
        }

        /* 新增獨立根節點 */
        function addRootNode() {
            finishCurrentEditing();
            const snapshot = captureState();
            const cx = 4000 + (Math.random() * 200 - 100);
            const cy = 4000 + (Math.random() * 200 - 100);
            const id = createNode("獨立根節點", cx, cy, null, true, false);
            pushHistorySnapshot(snapshot);
            selectNode(id);
        }

        /* 切換 12 款畫布背景 */
        function changeCanvasBackground(bgClass) {
            canvasArea.className = bgClass;
            currentCanvasBg = bgClass;
        }

        /* 複製與貼上 (Ctrl+C / Ctrl+V) */
        function copySelected() {
            if (selectedId !== null) {
                const node = nodes.find(n => n.id === selectedId);
                if (node) clipboardData = { type: "node", data: JSON.parse(JSON.stringify(node)) };
            } else if (selectedBoxId !== null) {
                const box = findBoxById(selectedBoxId);
                if (box) clipboardData = { type: "box", data: JSON.parse(JSON.stringify(box)) };
            }
        }

        function pasteClipboard() {
            if (!clipboardData) return;
            const snapshot = captureState();

            if (clipboardData.type === "node") {
                const item = clipboardData.data;
                const newId = nextId++;
                const newNode = {
                    ...item,
                    id: newId,
                    parentId: null,
                    x: item.x + 40,
                    y: item.y + 40,
                    text: item.text + " (副本)"
                };
                nodes.push(newNode);
                renderNode(newNode);
                selectNode(newId);
            } else if (clipboardData.type === "box") {
                const item = clipboardData.data;
                const newBoxId = nextBoxId++;
                const newBox = {
                    ...item,
                    id: newBoxId,
                    x: item.x + 30,
                    y: item.y + 30,
                    text: item.text + " (副本)"
                };
                standaloneBoxes.push(newBox);
                renderSingleLinkBox(newBox, true);
                selectBox(newBoxId);
            }

            drawLines();
            pushHistorySnapshot(snapshot);
        }

        /* 獨立新增 Link Box */
        function addStandaloneLinkBox() {
            finishCurrentEditing();
            const snapshot = captureState();
            const box = {
                id: nextBoxId++,
                text: "獨立 Link Box",
                x: 4000 - tx / scale + 50,
                y: 4000 - ty / scale + 50,
                width: 110, height: 34,
                color1: "#ffffff", color2: "#ffffff", colorType: "solid",
                opacity: 0.96, deg: 135, textColor: "#333333"
            };
            standaloneBoxes.push(box);
            renderSingleLinkBox(box, true);
            selectBox(box.id);
            pushHistorySnapshot(snapshot);
        }

        /* 結束 / 取消所有模式 */
        function cancelAllModes() {
            cancelLinkMode();
            cancelRelationshipMode();
            closeAdobePicker();
        }

        /* 套用字體樣式 */
        function applyTextStyle(property, value) {
            const snapshot = captureState();
            let target = null;
            if (selectedId !== null) target = nodes.find(n => n.id === selectedId);
            else if (selectedBoxId !== null) target = findBoxById(selectedBoxId);

            if (target) {
                target[property] = value;
                const el = document.getElementById(selectedId !== null ? `node-${target.id}` : `box-${target.id}`);
                if (el) {
                    const textEl = el.querySelector(".node-text, .link-box-text");
                    if (textEl) textEl.style[property] = value;
                }
                pushHistorySnapshot(snapshot);
            }
        }

        /* 歷史記錄 Capture */
        function captureState() {
            return JSON.stringify({
                nodes, crossLinks, standaloneBoxes,
                nextId, nextLinkId, nextBoxId,
                multiTreeEnabled, currentCanvasBg
            });
        }

        function pushHistorySnapshot(snapshot) {
            if (isRestoringHistory || !snapshot) return;
            const current = captureState();
            if (snapshot === current) return;
            undoStack.push(snapshot);
            if (undoStack.length > 60) undoStack.shift();
            redoStack = [];
        }

        function undo() {
            finishCurrentEditing();
            if (!undoStack.length) return;
            isRestoringHistory = true;
            redoStack.push(captureState());
            restoreState(JSON.parse(undoStack.pop()));
            isRestoringHistory = false;
        }

        function redo() {
            finishCurrentEditing();
            if (!redoStack.length) return;
            isRestoringHistory = true;
            undoStack.push(captureState());
            restoreState(JSON.parse(redoStack.pop()));
            isRestoringHistory = false;
        }

        function restoreState(state) {
            stopSpeechRecognition(false);
            treeCanvas.querySelectorAll(".node, .link-box").forEach(el => el.remove());

            nodes = state.nodes || [];
            crossLinks = state.crossLinks || [];
            standaloneBoxes = state.standaloneBoxes || [];
            nextId = state.nextId || 0;
            nextLinkId = state.nextLinkId || 0;
            nextBoxId = state.nextBoxId || 0;
            multiTreeEnabled = !!state.multiTreeEnabled;
            document.getElementById("multi-tree-toggle").checked = multiTreeEnabled;

            if (state.currentCanvasBg) changeCanvasBackground(state.currentCanvasBg);

            nodes.forEach(renderNode);
            renderLinkBoxes();
            drawLines();
        }

        /* Node 建置 */
        function createNode(text, x, y, parentId, autoEdit = false, recordHistory = true) {
            const snapshot = recordHistory ? captureState() : null;
            const parent = nodes.find(n => n.id === parentId);

            const node = {
                id: nextId++,
                text: String(text ?? "新節點"),
                x, y, parentId, width: 130, height: 44,
                color1: parent ? parent.color1 : "#1565c0",
                color2: parent ? parent.color2 : "#1e88e5",
                colorType: parent ? parent.colorType : "gradient",
                opacity: parent ? parent.opacity : 1, deg: parent ? parent.deg : 135,
                fontSize: "14px", fontFamily: "sans-serif", fontWeight: "normal", textColor: "#ffffff"
            };

            nodes.push(node);
            renderNode(node);
            drawLines();

            if (snapshot) pushHistorySnapshot(snapshot);
            if (autoEdit) window.setTimeout(() => startTextEdit("node", node.id), 40);
            return node.id;
        }

        function renderNode(node) {
            const element = document.createElement("div");
            element.className = "node";
            element.id = `node-${node.id}`;

            setElementGeometry(element, node);
            applyStyle(element, node);

            const content = document.createElement("div");
            content.className = "node-content";
            const text = document.createElement("span");
            text.className = "node-text";
            text.textContent = node.text;

            if (node.fontFamily) text.style.fontFamily = node.fontFamily;
            if (node.fontSize) text.style.fontSize = node.fontSize;
            if (node.fontWeight) text.style.fontWeight = node.fontWeight;
            if (node.textColor) text.style.color = node.textColor;

            content.appendChild(text);
            element.appendChild(content);

            const quickAdd = document.createElement("button");
            quickAdd.className = "node-quick-add";
            quickAdd.textContent = "+";
            quickAdd.onclick = (e) => { e.stopPropagation(); addChildTo(node.id, true); };
            element.appendChild(quickAdd);

            const menuTrigger = document.createElement("button");
            menuTrigger.className = "inplace-menu-trigger";
            menuTrigger.textContent = "✎";
            menuTrigger.onclick = (e) => { e.stopPropagation(); toggleInplaceMenu(node.id); };
            element.appendChild(menuTrigger);

            element.appendChild(createSpeechButton("node", node.id));

            const menu = document.createElement("div");
            menu.className = "inplace-action-menu";
            menu.id = `menu-${node.id}`;
            menu.innerHTML = `
                <button class="inplace-btn" title="加子節點" onclick="event.stopPropagation(); addChildTo(${node.id}, true)">＋</button>
                <button class="inplace-btn" title="加同級節點" onclick="event.stopPropagation(); addSiblingTo(${node.id}, true)">↔</button>
                <button class="inplace-btn" title="上載圖片" onclick="event.stopPropagation(); uploadNodeImage(${node.id})">🖼️</button>
                <button class="inplace-btn" title="嵌入影片" onclick="event.stopPropagation(); embedNodeVideo(${node.id})">🎥</button>
                <button class="inplace-btn" title="轉父節點" onclick="event.stopPropagation(); startReparent(${node.id})">⇆</button>
                <button class="inplace-btn" title="取消連結" onclick="event.stopPropagation(); startUnlink(${node.id})">⛓</button>
                <button class="inplace-btn" title="跨節點連線" onclick="event.stopPropagation(); startLink(${node.id})">🔗</button>
                <button class="inplace-btn" title="調色盤" onclick="event.stopPropagation(); openPickerForNode(event, ${node.id})">🎨</button>
                <button class="inplace-btn" title="刪除" onclick="event.stopPropagation(); deleteNodeById(${node.id})">✕</button>
            `;
            element.appendChild(menu);

            addResizeHandles(element, "node", node);

            element.addEventListener("mousedown", (e) => {
                if (isInteractiveTarget(e.target) || editingTarget) return;
                e.stopPropagation();

                if (relationshipMode) {
                    if (relationshipSourceId === node.id) return;
                    if (relationshipMode === "reparent") completeReparent(node.id);
                    else if (relationshipMode === "unlink") completeUnlink(node.id);
                    return;
                }

                if (linkMode && linkFromId !== null && linkFromId !== node.id) {
                    completeLink(node.id);
                    return;
                }

                selectNode(node.id);
                beginDrag(e, "node", node, element);
            });

            element.addEventListener("dblclick", (e) => {
                if (isInteractiveTarget(e.target)) return;
                e.stopPropagation();
                startTextEdit("node", node.id);
            });

            treeCanvas.appendChild(element);
            renderNodeMedia(node);
        }

        /* ================= 圖片上載與影片嵌入功能 ================= */
        function uploadNodeImage(id) {
            const node = nodes.find(n => n.id === id);
            if (!node) return;

            const input = document.createElement("input");
            input.type = "file";
            input.accept = "image/*";
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    const snapshot = captureState();
                    node.image = evt.target.result; // 保存 Base64 圖片數據
                    node.width = Math.max(node.width, 220);
                    node.height = Math.max(node.height, 160);

                    renderNodeMedia(node);
                    pushHistorySnapshot(snapshot);
                };
                reader.readAsDataURL(file);
            };
            input.click();
        }

        function embedNodeVideo(id) {
            const node = nodes.find(n => n.id === id);
            if (!node) return;

            const url = prompt("請輸入影片網址 (例如 MP4 連結 或 YouTube 網址):");
            if (!url) return;

            const snapshot = captureState();

            if (url.includes("youtube.com") || url.includes("youtu.be")) {
                let videoId = "";
                if (url.includes("youtu.be")) {
                    videoId = url.split("/").pop();
                } else {
                    const urlParams = new URLSearchParams(new URL(url).search);
                    videoId = urlParams.get("v");
                }
                node.videoUrl = `https://www.youtube.com/embed/${videoId}`;
                node.isVideoEmbed = true;
            } else {
                node.videoUrl = url;
                node.isVideoEmbed = false;
            }

            node.width = Math.max(node.width, 280);
            node.height = Math.max(node.height, 200);

            renderNodeMedia(node);
            pushHistorySnapshot(snapshot);
        }

        function renderNodeMedia(node) {
            const el = document.getElementById(`node-${node.id}`);
            if (!el) return;

            const content = el.querySelector(".node-content");
            content.querySelectorAll("img, video, iframe").forEach(m => m.remove());

            if (node.image) {
                const img = document.createElement("img");
                img.src = node.image;
                content.appendChild(img);
            } else if (node.videoUrl) {
                if (node.isVideoEmbed) {
                    const iframe = document.createElement("iframe");
                    iframe.src = node.videoUrl;
                    iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
                    iframe.allowFullscreen = true;
                    content.appendChild(iframe);
                } else {
                    const video = document.createElement("video");
                    video.src = node.videoUrl;
                    video.controls = true;
                    content.appendChild(video);
                }
            }

            setElementGeometry(el, node);
            drawLines();
        }

        /* Link Box 渲染與 Attached 解除 */
        function renderLinkBoxes() {
            treeCanvas.querySelectorAll(".link-box").forEach(el => el.remove());
            crossLinks.forEach(link => {
                link.boxes.forEach(box => renderSingleLinkBox(box, false, link.id));
            });
            standaloneBoxes.forEach(box => renderSingleLinkBox(box, true));
        }

        function renderSingleLinkBox(box, isStandalone = false, parentLinkId = null) {
            const element = document.createElement("div");
            element.className = "link-box";
            element.id = `box-${box.id}`;

            setElementGeometry(element, box);
            applyStyle(element, box);

            const content = document.createElement("div");
            content.className = "link-box-content";
            const text = document.createElement("span");
            text.className = "link-box-text";
            text.textContent = box.text;

            if (box.textColor) text.style.color = box.textColor;
            content.appendChild(text);
            element.appendChild(content);

            if (!isStandalone && parentLinkId !== null) {
                const unlinkBtn = document.createElement("button");
                unlinkBtn.className = "box-unlink-btn";
                unlinkBtn.textContent = "⛓";
                unlinkBtn.title = "解除整條 Cross Link";
                unlinkBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteCrossLinkByLinkId(parentLinkId);
                };
                element.appendChild(unlinkBtn);
            }

            const colorBtn = document.createElement("button");
            colorBtn.className = "box-color-trigger";
            colorBtn.textContent = "🎨";
            colorBtn.onclick = (e) => { e.stopPropagation(); openPickerForBox(e, box.id); };
            element.appendChild(colorBtn);

            addResizeHandles(element, "box", box);

            element.addEventListener("mousedown", (e) => {
                if (isInteractiveTarget(e.target) || editingTarget) return;
                e.stopPropagation();
                selectBox(box.id);
                beginDrag(e, "box", box, element);
            });

            element.addEventListener("dblclick", (e) => {
                if (isInteractiveTarget(e.target)) return;
                e.stopPropagation();
                startTextEdit("box", box.id);
            });

            treeCanvas.appendChild(element);
        }

        function deleteCrossLinkByLinkId(linkId) {
            const snapshot = captureState();
            crossLinks = crossLinks.filter(l => l.id !== linkId);
            renderLinkBoxes();
            drawLines();
            pushHistorySnapshot(snapshot);
        }

        function findBoxById(boxId) {
            for (const link of crossLinks) {
                const box = link.boxes.find(b => b.id === boxId);
                if (box) return box;
            }
            return standaloneBoxes.find(b => b.id === boxId) || null;
        }

        /* 雙擊多行文字編輯 */
        function startTextEdit(type, id) {
            finishCurrentEditing();
            const item = type === "node" ? nodes.find(n => n.id === id) : findBoxById(id);
            const el = document.getElementById(type === "node" ? `node-${id}` : `box-${id}`);
            if (!item || !el) return;

            if (type === "node") selectNode(id); else selectBox(id);

            const content = el.querySelector(type === "node" ? ".node-content" : ".link-box-content");
            const textEl = content.querySelector(".node-text, .link-box-text");

            const textarea = document.createElement("textarea");
            textarea.className = "text-editor";
            textarea.value = item.text;
            textEl.style.display = "none";
            content.appendChild(textarea);
            el.classList.add("editing");

            editingTarget = { type, id, item, element: el, textElement: textEl, textarea, originalState: captureState() };

            textarea.focus();
            textarea.select();

            textarea.addEventListener("keydown", (e) => {
                if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    finishCurrentEditing();
                } else if (e.key === "Escape") {
                    cancelAllModes();
                }
            });
        }

        function finishCurrentEditing() {
            if (!editingTarget) return;
            const { type, item, element, textElement, textarea, originalState } = editingTarget;
            item.text = textarea.value.trim() || (type === "node" ? "新節點" : "連結");
            textElement.textContent = item.text;
            textElement.style.display = "";
            textarea.remove();
            element.classList.remove("editing");
            editingTarget = null;
            pushHistorySnapshot(originalState);
            drawLines();
        }

        /* 顏色轉算 (Adobe Panel: HEX, RGB, HSB, CMYK, LAB, RGB Code) */
        function onColorPickerChange() {
            const hex = document.getElementById("picker-c1").value;
            updateAdobePanelFields(hex);
            applyColorPicker();
        }

        function updateAdobePanelFields(hex) {
            document.getElementById("color-hex").value = hex.toUpperCase();
            const rgb = hexToRgb(hex);
            document.getElementById("color-rgb-code").value = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
            document.getElementById("rgb-r").value = rgb.r;
            document.getElementById("rgb-g").value = rgb.g;
            document.getElementById("rgb-b").value = rgb.b;

            const hsb = rgbToHsb(rgb.r, rgb.g, rgb.b);
            document.getElementById("hsb-h").value = hsb.h;
            document.getElementById("hsb-s").value = hsb.s;
            document.getElementById("hsb-b").value = hsb.b;

            const cmyk = rgbToCmyk(rgb.r, rgb.g, rgb.b);
            document.getElementById("cmyk-c").value = cmyk.c;
            document.getElementById("cmyk-m").value = cmyk.m;
            document.getElementById("cmyk-y").value = cmyk.y;
            document.getElementById("cmyk-k").value = cmyk.k;

            const lab = rgbToLab(rgb.r, rgb.g, rgb.b);
            document.getElementById("lab-l").value = lab.l;
            document.getElementById("lab-a").value = lab.a;
            document.getElementById("lab-b").value = lab.b;
        }

        function updateFromHex(hex) {
            if (/^#[0-9A-F]{6}$/i.test(hex)) {
                document.getElementById("picker-c1").value = hex;
                updateAdobePanelFields(hex);
                applyColorPicker();
            }
        }

        function updateFromRgb() {
            const r = parseInt(document.getElementById("rgb-r").value) || 0;
            const g = parseInt(document.getElementById("rgb-g").value) || 0;
            const b = parseInt(document.getElementById("rgb-b").value) || 0;
            const hex = rgbToHex(r, g, b);
            document.getElementById("picker-c1").value = hex;
            updateAdobePanelFields(hex);
            applyColorPicker();
        }

        function updateFromHsb() {
            const h = parseInt(document.getElementById("hsb-h").value) || 0;
            const s = parseInt(document.getElementById("hsb-s").value) || 0;
            const b = parseInt(document.getElementById("hsb-b").value) || 0;
            const rgb = hsbToRgb(h, s, b);
            const hex = rgbToHex(rgb.r, rgb.g, rgb.b);
            document.getElementById("picker-c1").value = hex;
            updateAdobePanelFields(hex);
            applyColorPicker();
        }

        function hexToRgb(hex) {
            const num = parseInt(hex.replace("#", ""), 16);
            return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
        }

        function rgbToHex(r, g, b) {
            return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
        }

        function rgbToHsb(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            let max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, v = max, d = max - min;
            s = max === 0 ? 0 : d / max;
            if (max === min) h = 0;
            else {
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }
            return { h: Math.round(h * 360), s: Math.round(s * 100), b: Math.round(v * 100) };
        }

        function hsbToRgb(h, s, v) {
            s /= 100; v /= 100;
            let c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;
            let r = 0, g = 0, b = 0;
            if (h < 60) { r = c; g = x; }
            else if (h < 120) { r = x; g = c; }
            else if (h < 180) { g = c; b = x; }
            else if (h < 240) { g = x; b = c; }
            else if (h < 300) { r = x; b = c; }
            else { r = c; b = x; }
            return { r: Math.round((r + m) * 255), g: Math.round((g + m) * 255), b: Math.round((b + m) * 255) };
        }

        function rgbToCmyk(r, g, b) {
            let c = 1 - (r / 255), m = 1 - (g / 255), y = 1 - (b / 255), k = Math.min(c, Math.min(m, y));
            if (k === 1) return { c: 0, m: 0, y: 0, k: 100 };
            return {
                c: Math.round(((c - k) / (1 - k)) * 100),
                m: Math.round(((m - k) / (1 - k)) * 100),
                y: Math.round(((y - k) / (1 - k)) * 100),
                k: Math.round(k * 100)
            };
        }

        function rgbToLab(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            r = r > 0.04045 ? Math.pow((r + 0.055) / 1.055, 2.4) : r / 12.92;
            g = g > 0.04045 ? Math.pow((g + 0.055) / 1.055, 2.4) : g / 12.92;
            b = b > 0.04045 ? Math.pow((b + 0.055) / 1.055, 2.4) : b / 12.92;
            let x = (r * 0.4124 + g * 0.3576 + b * 0.1805) / 0.95047;
            let y = (r * 0.2126 + g * 0.7152 + b * 0.0722) / 1.00000;
            let z = (r * 0.0193 + g * 0.1192 + b * 0.9505) / 1.08883;
            x = x > 0.008856 ? Math.pow(x, 1/3) : (7.787 * x) + (16 / 116);
            y = y > 0.008856 ? Math.pow(y, 1/3) : (7.787 * y) + (16 / 116);
            z = z > 0.008856 ? Math.pow(z, 1/3) : (7.787 * z) + (16 / 116);
            return { l: Math.round((116 * y) - 16), a: Math.round(500 * (x - y)), b: Math.round(200 * (y - z)) };
        }

        /* 快捷鍵設定 (含 Ctrl+C, Ctrl+V) */
        function setupKeyboardShortcuts() {
            window.addEventListener("keydown", (e) => {
                const tag = document.activeElement?.tagName?.toLowerCase();
                if (tag === "input" || tag === "textarea") return;

                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "c") {
                    e.preventDefault(); copySelected();
                } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "v") {
                    e.preventDefault(); pasteClipboard();
                } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
                    e.preventDefault(); if (e.shiftKey) redo(); else undo();
                } else if (e.key === "Tab") {
                    e.preventDefault(); if (selectedId !== null) addChildTo(selectedId, true);
                } else if (e.key === "Enter") {
                    e.preventDefault(); if (selectedId !== null) addSiblingTo(selectedId, true);
                } else if (e.key === "Delete" || e.key === "Backspace") {
                    e.preventDefault(); deleteSelected();
                } else if (e.key === "Escape") {
                    cancelAllModes();
                }
            });
        }

        /* 繪製連線 */
        function drawLines() {
            Array.from(svg.children).forEach(child => { if (child.id !== "temp-link-line") child.remove(); });

            nodes.forEach(node => {
                if (node.parentId === null || node.parentId === undefined) return;
                const parent = nodes.find(n => n.id === node.parentId);
                if (!parent) return;

                const startX = parent.x + parent.width, startY = parent.y + parent.height / 2;
                const endX = node.x, endY = node.y + node.height / 2;
                const controlX = (startX + endX) / 2;

                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", `M ${startX} ${startY} C ${controlX} ${startY}, ${controlX} ${endY}, ${endX} ${endY}`);
                path.setAttribute("class", "branch-line");
                path.setAttribute("stroke", node.color1 || "#4285f4");
                svg.appendChild(path);
            });

            crossLinks.forEach(link => {
                const from = nodes.find(n => n.id === link.fromId);
                const to = nodes.find(n => n.id === link.toId);
                if (!from || !to) return;

                const startX = from.x + from.width / 2, startY = from.y + from.height / 2;
                const endX = to.x + to.width / 2, endY = to.y + to.height / 2;
                const middleX = (startX + endX) / 2, middleY = (startY + endY) / 2 - 40;

                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", `M ${startX} ${startY} Q ${middleX} ${middleY} ${endX} ${endY}`);
                path.setAttribute("class", "cross-link");
                path.setAttribute("stroke", "#ff9800");
                svg.appendChild(path);
            });
        }

        /* 其餘互動與基礎事件處理 */
        function addChildTo(parentId, autoEdit = false) {
            finishCurrentEditing();
            const parent = nodes.find(n => n.id === parentId);
            if (!parent) return;
            const siblings = nodes.filter(n => n.parentId === parentId);
            const id = createNode("新節點", parent.x + parent.width + 80, parent.y + siblings.length * 65, parentId, autoEdit, true);
            selectNode(id);
        }

        function addSiblingTo(id, autoEdit = false) {
            finishCurrentEditing();
            const node = nodes.find(n => n.id === id);
            if (!node) return;
            if (node.parentId === null) {
                if (multiTreeEnabled) addRootNode();
                else addChildTo(id, autoEdit);
                return;
            }
            const newId = createNode("新節點", node.x, node.y + node.height + 20, node.parentId, autoEdit, true);
            selectNode(newId);
        }

        function addChildToSelected(autoEdit = false) { if (selectedId !== null) addChildTo(selectedId, autoEdit); }
        function addSiblingToSelected(autoEdit = false) { if (selectedId !== null) addSiblingTo(selectedId, autoEdit); }

        function deleteSelected() {
            if (selectedId !== null) deleteNodeById(selectedId);
            else if (selectedBoxId !== null) deleteBoxById(selectedBoxId);
        }

        function deleteNodeById(id) {
            finishCurrentEditing();
            const snapshot = captureState();
            nodes = nodes.filter(n => n.id !== id && n.parentId !== id);
            crossLinks = crossLinks.filter(l => l.fromId !== id && l.toId !== id);
            selectedId = null;
            restoreState(JSON.parse(snapshot));
            pushHistorySnapshot(snapshot);
        }

        function deleteBoxById(boxId) {
            finishCurrentEditing();
            const snapshot = captureState();
            crossLinks.forEach(l => { l.boxes = l.boxes.filter(b => b.id !== boxId); });
            standaloneBoxes = standaloneBoxes.filter(b => b.id !== boxId);
            selectedBoxId = null;
            renderLinkBoxes();
            pushHistorySnapshot(snapshot);
        }

        function startLink(id) {
            cancelAllModes();
            linkMode = true; linkFromId = id;
            canvasArea.classList.add("linking");
            document.getElementById(`node-${id}`)?.classList.add("linking-source");
            showRelationshipMessage("🔗 跨節點連線：請點擊目標節點完成連線；按 Esc 取消");
        }

        function completeLink(targetId) {
            if (linkFromId === null || targetId === linkFromId) return;
            const snapshot = captureState();
            const from = nodes.find(n => n.id === linkFromId), to = nodes.find(n => n.id === targetId);
            const box = {
                id: nextBoxId++, text: "跨連線",
                x: (from.x + to.x) / 2, y: (from.y + to.y) / 2,
                width: 110, height: 34, color1: "#ffffff", color2: "#ffffff", colorType: "solid", opacity: 0.95, deg: 135
            };
            crossLinks.push({ id: nextLinkId++, fromId: from.id, toId: targetId, boxes: [box] });
            cancelLinkMode();
            renderLinkBoxes();
            drawLines();
            pushHistorySnapshot(snapshot);
        }

        function cancelLinkMode() {
            linkMode = false; linkFromId = null;
            canvasArea.classList.remove("linking");
            document.querySelectorAll(".node").forEach(n => n.classList.remove("linking-source"));
            hideRelationshipMessage();
        }

        function startReparent(id) {
            cancelAllModes();
            relationshipMode = "reparent"; relationshipSourceId = id;
            showRelationshipMessage(`⇆ 轉父節點：請點擊新的父節點；按 Esc 取消`);
        }

        function completeReparent(newParentId) {
            if (relationshipSourceId === newParentId) return;
            const snapshot = captureState();
            const target = nodes.find(n => n.id === relationshipSourceId);
            if (target) target.parentId = newParentId;
            cancelRelationshipMode();
            drawLines();
            pushHistorySnapshot(snapshot);
        }

        function startUnlink(id) {
            cancelAllModes();
            relationshipMode = "unlink"; relationshipSourceId = id;
            showRelationshipMessage(`⛓ 取消連結：請點擊要解除連線的另一個節點；按 Esc 取消`);
        }

        function completeUnlink(targetId) {
            const snapshot = captureState();
            crossLinks = crossLinks.filter(l => !((l.fromId === relationshipSourceId && l.toId === targetId) || (l.fromId === targetId && l.toId === relationshipSourceId)));
            const target = nodes.find(n => n.id === targetId);
            if (target && target.parentId === relationshipSourceId) target.parentId = null;
            cancelRelationshipMode();
            renderLinkBoxes();
            drawLines();
            pushHistorySnapshot(snapshot);
        }

        function cancelRelationshipMode() {
            relationshipMode = null; relationshipSourceId = null;
            hideRelationshipMessage();
        }

        function showRelationshipMessage(msg) {
            document.getElementById("banner-text").textContent = msg;
            relationshipModeBanner.classList.add("active");
        }

        function hideRelationshipMessage() {
            relationshipModeBanner.classList.remove("active");
        }

        function selectNode(id) {
            selectedId = id; selectedBoxId = null;
            document.querySelectorAll(".node, .link-box").forEach(el => el.classList.remove("selected"));
            document.getElementById(`node-${id}`)?.classList.add("selected");
        }

        function selectBox(id) {
            selectedBoxId = id; selectedId = null;
            document.querySelectorAll(".node, .link-box").forEach(el => el.classList.remove("selected"));
            document.getElementById(`box-${id}`)?.classList.add("selected");
        }

        function openPickerForNode(e, id) { activePickerTarget = { type: "node", id }; popPicker(e, nodes.find(n => n.id === id)); }
        function openPickerForBox(e, id) { activePickerTarget = { type: "box", id }; popPicker(e, findBoxById(id)); }

        function popPicker(e, item) {
            pickerStartSnapshot = captureState();
            document.getElementById("picker-c1").value = item.color1 || "#1565c0";
            document.getElementById("picker-c2").value = item.color2 || "#1e88e5";
            updateAdobePanelFields(item.color1 || "#1565c0");
            adobePicker.style.display = "flex";
            adobePicker.style.left = `${Math.min(window.innerWidth - 290, e.clientX + 10)}px`;
            adobePicker.style.top = `${Math.min(window.innerHeight - 300, e.clientY + 10)}px`;
        }

        function closeAdobePicker() { adobePicker.style.display = "none"; activePickerTarget = null; }

        function applyColorPicker() {
            if (!activePickerTarget) return;
            const item = activePickerTarget.type === "node" ? nodes.find(n => n.id === activePickerTarget.id) : findBoxById(activePickerTarget.id);
            if (!item) return;
            item.color1 = document.getElementById("picker-c1").value;
            item.color2 = document.getElementById("picker-c2").value;
            item.deg = parseInt(document.getElementById("picker-angle").value);
            item.opacity = parseInt(document.getElementById("picker-alpha").value) / 100;
            const el = document.getElementById(activePickerTarget.type === "node" ? `node-${item.id}` : `box-${item.id}`);
            if (el) applyStyle(el, item);
            drawLines();
        }

        function setPickerMode(mode) {
            document.querySelectorAll(".picker-tab").forEach(t => t.classList.remove("active"));
            document.getElementById(`tab-${mode}`)?.classList.add("active");
            if (!activePickerTarget) return;
            const item = activePickerTarget.type === "node" ? nodes.find(n => n.id === activePickerTarget.id) : findBoxById(activePickerTarget.id);
            if (item) { item.colorType = mode; applyColorPicker(); }
        }

        function applyStyle(element, item) {
            const alpha = item.opacity ?? 1;
            const color1 = hexToRgba(item.color1 || "#1565c0", alpha);
            const color2 = hexToRgba(item.color2 || "#1e88e5", alpha);
            const degree = item.deg ?? 135;

            if (item.colorType === "sharp") element.style.background = `linear-gradient(${degree}deg, ${color1} 50%, ${color2} 50%)`;
            else if (item.colorType === "gradient") element.style.background = `linear-gradient(${degree}deg, ${color1}, ${color2})`;
            else element.style.background = color1;
            element.style.border = `2px solid ${item.color1 || "#1565c0"}`;
        }

        function hexToRgba(hex, alpha) {
            const rgb = hexToRgb(hex);
            return `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${alpha})`;
        }

        function setElementGeometry(element, item) {
            element.style.left = `${item.x}px`;
            element.style.top = `${item.y}px`;
            element.style.width = `${item.width}px`;
            element.style.height = `${item.height}px`;
        }

        function addResizeHandles(element, type, item) {
            ["n", "s", "e", "w", "ne", "nw", "se", "sw"].forEach(dir => {
                const handle = document.createElement("div");
                handle.className = `resize-handle ${dir}`;
                handle.onmousedown = (e) => {
                    e.stopPropagation();
                    beginResize(e, type, item, element, dir);
                };
                element.appendChild(handle);
            });
        }

        function beginResize(e, type, item, element, dir) {
            gestureSnapshot = captureState();
            gestureStartClientX = e.clientX; gestureStartClientY = e.clientY;
            resizeTarget = { type, item, element, dir, startX: item.x, startY: item.y, startW: item.width, startH: item.height };
        }

        function beginDrag(e, type, item, element) {
            const rect = canvasArea.getBoundingClientRect();
            gestureSnapshot = captureState();
            gestureStartClientX = e.clientX; gestureStartClientY = e.clientY;
            dragMouseX = (e.clientX - rect.left - tx) / scale - item.x;
            dragMouseY = (e.clientY - rect.top - ty) / scale - item.y;
            dragTarget = { type, item, element };
        }

        function setupCanvasEvents() {
            canvasArea.addEventListener("mousedown", (e) => {
                if (e.target === canvasArea || e.target === treeCanvas || e.target === svg) {
                    finishCurrentEditing();
                    cancelAllModes();
                    isPanning = true;
                    panStartX = e.clientX - tx;
                    panStartY = e.clientY - ty;
                }
            });

            window.addEventListener("mousemove", (e) => {
                const rect = canvasArea.getBoundingClientRect();
                const mouseX = (e.clientX - rect.left - tx) / scale;
                const mouseY = (e.clientY - rect.top - ty) / scale;

                if (dragTarget) {
                    dragTarget.item.x = mouseX - dragMouseX;
                    dragTarget.item.y = mouseY - dragMouseY;
                    dragTarget.element.style.left = `${dragTarget.item.x}px`;
                    dragTarget.element.style.top = `${dragTarget.item.y}px`;
                    drawLines();
                } else if (resizeTarget) {
                    const dx = (e.clientX - gestureStartClientX) / scale;
                    const dy = (e.clientY - gestureStartClientY) / scale;
                    if (resizeTarget.dir.includes("e")) resizeTarget.item.width = Math.max(MIN_NODE_WIDTH, resizeTarget.startW + dx);
                    if (resizeTarget.dir.includes("s")) resizeTarget.item.height = Math.max(MIN_NODE_HEIGHT, resizeTarget.startH + dy);
                    setElementGeometry(resizeTarget.element, resizeTarget.item);
                    drawLines();
                } else if (isPanning) {
                    tx = e.clientX - panStartX;
                    ty = e.clientY - panStartY;
                    updateTransform();
                }
            });

            window.addEventListener("mouseup", () => {
                if (dragTarget || resizeTarget) pushHistorySnapshot(gestureSnapshot);
                dragTarget = null; resizeTarget = null; isPanning = false;
            });

            canvasArea.addEventListener("wheel", (e) => {
                e.preventDefault();
                const factor = e.deltaY < 0 ? 1.1 : 0.9;
                scale = Math.max(0.2, Math.min(3, scale * factor));
                updateTransform();
            }, { passive: false });
        }

        function updateTransform() { treeCanvas.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`; }
        function zoomIn() { scale = Math.min(3, scale * 1.2); updateTransform(); }
        function zoomOut() { scale = Math.max(0.2, scale * 0.8); updateTransform(); }
        function backToCenter() { tx = -4000 + canvasArea.offsetWidth / 2; ty = -4000 + canvasArea.offsetHeight / 2; scale = 1; updateTransform(); }

        function toggleSidebar() {
            const sidebar = document.getElementById("sidebar");
            sidebar.classList.toggle("collapsed");
            document.getElementById("sidebar-toggle-btn").textContent = sidebar.classList.contains("collapsed") ? "▶" : "◀";
        }

        function toggleInplaceMenu(id) {
            const menu = document.getElementById(`menu-${id}`);
            menu?.classList.toggle("active");
        }

        function isInteractiveTarget(target) {
            return Boolean(target.closest("button, input, textarea, select, .resize-handle, .inplace-action-menu"));
        }

        function createSpeechButton(type, id) {
            const btn = document.createElement("button");
            btn.className = "speech-btn"; btn.textContent = "🎤";
            btn.onclick = (e) => { e.stopPropagation(); startSpeechFor(type, id, btn); };
            return btn;
        }

        async function startSpeechFor(type, id, btn) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { alert("瀏覽器不支援 Web Speech Recognition"); return; }
            const item = type === "node" ? nodes.find(n => n.id === id) : findBoxById(id);
            if (!item) return;

            const rec = new SpeechRecognition();
            rec.lang = "zh-HK";
            rec.onresult = (e) => {
                item.text += " " + e.results[0][0].transcript;
                const el = document.getElementById(type === "node" ? `node-${id}` : `box-${id}`);
                if (el) el.querySelector(".node-text, .link-box-text").textContent = item.text;
                drawLines();
            };
            rec.start();
        }

        function requestPermanentMicrophonePermission() {
            navigator.mediaDevices?.getUserMedia({ audio: true }).then(() => {
                permissionStatus.className = "permission-status granted";
                permissionStatus.textContent = "✅ 咪高峰權限已啟用";
            }).catch(() => {
                permissionStatus.className = "permission-status denied";
                permissionStatus.textContent = "❌ 咪高峰權限被拒絕";
            });
        }

        function checkMicrophonePermission() {
            permissionStatus.textContent = "請按上方按鈕啟用咪高峰權限";
        }

        /* 匯出／匯入保存設定 */
        function exportJSON() {
            finishCurrentEditing();
            const data = captureState();
            const blob = new Blob([data], { type: "application/json" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "mindmap-pro-backup.json";
            a.click();
        }

        function importJSON() {
            finishCurrentEditing();
            const input = document.createElement("input");
            input.type = "file"; input.accept = ".json";
            input.onchange = () => {
                const file = input.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    try {
                        const data = JSON.parse(reader.result);
                        restoreState(data);
                    } catch (err) { alert("匯入失敗：格式不正確。"); }
                };
                reader.readAsText(file);
            };
            input.click();
        }
    </script>
</body>
</html>

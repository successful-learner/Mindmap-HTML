<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >
    <title>Mind Map Pro - 多行、縮放、語音修復及關係編輯版</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            color-scheme: light;
        }

        body {
            --bg: #f5f5f5;
            --sidebar-bg: #ffffff;
            --sidebar-border: #e0e0e0;
            --text: #1a1a1a;
            --text-sub: #666666;
            --btn-bg: #f0f0f0;
            --btn-border: #dddddd;
            --btn-hover: #e4e4e4;
            --input-bg: #ffffff;
            --input-focus: #4285f4;
            --canvas-bg: #fafafa;
            --node-shadow: rgba(0, 0, 0, 0.14);
            --accent: #4285f4;

            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            position: relative;
            background: var(--bg);
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        /* =========================
           Sidebar
        ========================= */

        .sidebar-toggle-btn {
            position: absolute;
            top: 15px;
            left: 270px;
            z-index: 301;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--sidebar-bg);
            border: 1px solid var(--sidebar-border);
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px var(--node-shadow);
            transition: left 0.3s, transform 0.2s;
        }

        .sidebar-toggle-btn:hover {
            transform: scale(1.06);
        }

        .sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--sidebar-border);
            display: flex;
            flex-direction: column;
            z-index: 300;
            flex-shrink: 0;
            overflow-y: auto;
            transition: margin-left 0.3s;
        }

        .sidebar.collapsed {
            margin-left: -260px;
        }

        .sidebar.collapsed + .sidebar-toggle-btn {
            left: 10px;
        }

        .sidebar-header {
            padding: 18px;
            border-bottom: 1px solid var(--sidebar-border);
        }

        .sidebar-header h1 {
            color: var(--text);
            font-size: 18px;
            font-weight: 700;
        }

        .sidebar-header p {
            margin-top: 4px;
            color: var(--text-sub);
            font-size: 11px;
            line-height: 1.5;
        }

        .sidebar-section {
            padding: 14px 18px;
            border-bottom: 1px solid var(--sidebar-border);
        }

        .sidebar-section h3 {
            color: var(--text-sub);
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .action-btn {
            width: 100%;
            min-height: 36px;
            padding: 8px 12px;
            margin-bottom: 6px;
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: 8px;
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            text-align: left;
        }

        .action-btn:hover {
            background: var(--btn-hover);
        }

        .permission-status {
            padding: 8px 10px;
            border-radius: 8px;
            background: #f5f5f5;
            color: var(--text-sub);
            font-size: 11px;
            line-height: 1.5;
        }

        .permission-status.granted {
            background: #e8f5e9;
            color: #1b5e20;
        }

        .permission-status.denied {
            background: #ffebee;
            color: #b71c1c;
        }

        /* =========================
           Canvas
        ========================= */

        #canvas-area {
            flex: 1;
            position: relative;
            overflow: hidden;
            cursor: grab;
            background: var(--canvas-bg);
        }

        #canvas-area.panning {
            cursor: grabbing;
        }

        #canvas-area.linking {
            cursor: crosshair !important;
        }

        #tree-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 8000px;
            height: 8000px;
            transform-origin: 0 0;
        }

        #lines-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 8000px;
            height: 8000px;
            pointer-events: none;
            z-index: 5;
            overflow: visible;
        }

        .branch-line {
            stroke-width: 2.5;
            fill: none;
        }

        .cross-link {
            stroke-width: 2;
            fill: none;
            stroke-dasharray: 6 4;
        }

        /* =========================
           Node / Link Box 共用
        ========================= */

        .node,
        .link-box {
            position: absolute;
            user-select: none;
            touch-action: none;
            overflow: visible;
        }

        .node-content,
        .link-box-content {
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
            scrollbar-width: thin;
        }

        .node-text,
        .link-box-text {
            display: block;
            width: 100%;
            max-width: 100%;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            word-break: break-word;
            text-align: center;
            line-height: 1.4;
            pointer-events: none;
        }

        .node.editing .node-content,
        .link-box.editing .link-box-content {
            overflow: hidden;
        }

        .text-editor {
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            resize: none;
            outline: none;
            border-radius: 5px;
            padding: 4px 6px;
            line-height: 1.4;
            text-align: left;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            word-break: break-word;
            overflow: auto;
            user-select: text;
            touch-action: auto;
        }

        /* =========================
           Node
        ========================= */

        .node {
            min-width: 90px;
            min-height: 40px;
            padding: 8px 18px;
            border-radius: 10px;
            color: #ffffff;
            font-size: 14px;
            cursor: move;
            box-shadow: 0 4px 12px var(--node-shadow);
            z-index: 20;
        }

        .node:hover {
            box-shadow: 0 7px 18px rgba(0, 0, 0, 0.18);
        }

        .node.selected {
            box-shadow:
                0 0 0 3px var(--input-focus),
                0 8px 20px var(--node-shadow);
        }

        .node.linking-source {
            animation: pulse 0.8s infinite alternate;
        }

        .node .text-editor {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.22);
            border: 1px solid rgba(255, 255, 255, 0.95);
        }

        .node .text-editor::selection {
            background: rgba(255, 255, 255, 0.4);
        }

        @keyframes pulse {
            from {
                transform: scale(1);
                box-shadow: 0 0 0 3px #ff9800;
            }

            to {
                transform: scale(1.06);
                box-shadow: 0 0 0 8px rgba(255, 152, 0, 0.4);
            }
        }

        /* =========================
           Link Box
        ========================= */

        .link-box {
            min-width: 80px;
            min-height: 32px;
            padding: 5px 9px;
            border-radius: 7px;
            color: #333333;
            font-size: 12px;
            cursor: move;
            box-shadow: 0 2px 9px rgba(0, 0, 0, 0.16);
            z-index: 25;
        }

        .link-box:hover {
            box-shadow: 0 5px 14px rgba(0, 0, 0, 0.2);
        }

        .link-box.selected {
            box-shadow:
                0 0 0 3px rgba(255, 152, 0, 0.45),
                0 5px 14px rgba(0, 0, 0, 0.2);
        }

        .link-box .text-editor {
            color: #333333;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid #ff9800;
        }

        /* =========================
           Resize Handles
        ========================= */

        .resize-handle {
            position: absolute;
            z-index: 45;
            display: none;
        }

        .node:hover .resize-handle,
        .node.selected .resize-handle,
        .link-box:hover .resize-handle,
        .link-box.selected .resize-handle {
            display: block;
        }

        .resize-handle.n,
        .resize-handle.s {
            left: 12px;
            right: 12px;
            height: 7px;
            cursor: ns-resize;
        }

        .resize-handle.n {
            top: -4px;
        }

        .resize-handle.s {
            bottom: -4px;
        }

        .resize-handle.e,
        .resize-handle.w {
            top: 10px;
            bottom: 10px;
            width: 7px;
            cursor: ew-resize;
        }

        .resize-handle.e {
            right: -4px;
        }

        .resize-handle.w {
            left: -4px;
        }

        .resize-handle.ne,
        .resize-handle.nw,
        .resize-handle.se,
        .resize-handle.sw {
            width: 11px;
            height: 11px;
            border-radius: 3px;
            background: #ffffff;
            border: 2px solid #4285f4;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.22);
        }

        .link-box .resize-handle.ne,
        .link-box .resize-handle.nw,
        .link-box .resize-handle.se,
        .link-box .resize-handle.sw {
            border-color: #ff9800;
        }

        .resize-handle.ne {
            top: -6px;
            right: -6px;
            cursor: nesw-resize;
        }

        .resize-handle.nw {
            top: -6px;
            left: -6px;
            cursor: nwse-resize;
        }

        .resize-handle.se {
            right: -6px;
            bottom: -6px;
            cursor: nwse-resize;
        }

        .resize-handle.sw {
            left: -6px;
            bottom: -6px;
            cursor: nesw-resize;
        }

        /* =========================
           Node Controls
        ========================= */

        .node-quick-add {
            position: absolute;
            right: -30px;
            top: 50%;
            transform: translateY(-50%) scale(0.8);
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: var(--accent);
            color: #ffffff;
            border: none;
            font-size: 17px;
            font-weight: bold;
            line-height: 23px;
            text-align: center;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
            z-index: 50;
        }

        .node:hover .node-quick-add,
        .node.selected .node-quick-add {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(-50%) scale(1);
        }

        .node-quick-add:hover {
            transform: translateY(-50%) scale(1.15) !important;
            background: #2b6cb0;
        }

        .inplace-menu-trigger,
        .box-color-trigger,
        .speech-btn {
            position: absolute;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--sidebar-bg);
            border: 1px solid var(--sidebar-border);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            z-index: 55;
        }

        .inplace-menu-trigger,
        .box-color-trigger {
            top: -10px;
            right: -10px;
            font-size: 11px;
        }

        .speech-btn {
            left: -10px;
            bottom: -10px;
            font-size: 11px;
        }

        .speech-btn:hover,
        .inplace-menu-trigger:hover,
        .box-color-trigger:hover {
            transform: scale(1.1);
        }

        .speech-btn.listening {
            color: #ffffff;
            background: #e53935;
            border-color: #b71c1c;
            animation: microphonePulse 0.75s infinite alternate;
        }

        @keyframes microphonePulse {
            from {
                box-shadow: 0 0 0 2px rgba(229, 57, 53, 0.3);
            }

            to {
                box-shadow: 0 0 0 7px rgba(229, 57, 53, 0.14);
            }
        }

        .inplace-action-menu {
            position: absolute;
            top: -48px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--sidebar-bg);
            border: 1px solid var(--sidebar-border);
            border-radius: 20px;
            padding: 4px 8px;
            display: none;
            gap: 4px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
            z-index: 100;
            white-space: nowrap;
        }

        .inplace-action-menu.active {
            display: flex;
            align-items: center;
        }

        .inplace-btn {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            color: var(--text);
            width: 27px;
            height: 27px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .inplace-btn:hover {
            background: var(--btn-hover);
            transform: scale(1.08);
        }

        /* =========================
           Adobe Picker
        ========================= */

        .adobe-picker-popover {
            position: absolute;
            z-index: 500;
            width: 230px;
            background: var(--sidebar-bg);
            border: 1px solid var(--sidebar-border);
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: none;
            flex-direction: column;
            gap: 8px;
            font-size: 12px;
            color: var(--text);
        }

        .adobe-picker-header {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
        }

        .picker-tabs {
            display: flex;
            gap: 4px;
            background: var(--btn-bg);
            padding: 2px;
            border-radius: 6px;
        }

        .picker-tab {
            flex: 1;
            text-align: center;
            padding: 4px 0;
            font-size: 10px;
            cursor: pointer;
            border-radius: 4px;
            color: var(--text-sub);
        }

        .picker-tab.active {
            background: var(--accent);
            color: #ffffff;
        }

        .picker-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* =========================
           Controls / Banner
        ========================= */

        .zoom-controls {
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 200;
        }

        .zoom-btn {
            width: 36px;
            height: 36px;
            background: var(--sidebar-bg);
            border: 1px solid var(--sidebar-border);
            border-radius: 8px;
            color: var(--text);
            cursor: pointer;
            box-shadow: 0 2px 7px rgba(0, 0, 0, 0.08);
        }

        .zoom-btn:hover {
            background: var(--btn-hover);
        }

        .tip-banner {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.82);
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            pointer-events: none;
            z-index: 190;
            display: flex;
            gap: 12px;
            white-space: nowrap;
        }

        @media (max-width: 760px) {
            .tip-banner {
                display: none;
            }

            .zoom-controls {
                right: 10px;
            }
        }

        /* 轉父節點／取消連結模式 */
        .node.relationship-source {
            box-shadow:
                0 0 0 4px #9c27b0,
                0 0 0 10px rgba(156, 39, 176, 0.22),
                0 8px 20px var(--node-shadow);
            animation: relationshipPulse 0.8s infinite alternate;
        }

        @keyframes relationshipPulse {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.04);
            }
        }

        .relationship-mode-banner {
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 260;
            display: none;
            max-width: min(560px, calc(100vw - 40px));
            padding: 10px 18px;
            border: 2px solid #9c27b0;
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.97);
            color: #4a148c;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.18);
        }

        .relationship-mode-banner.active {
            display: block;
        }
    </style>
</head>

<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h1>🌿 Mind Map Pro</h1>
            <p>
                雙擊文字編輯、多行換行、八方向縮放及語音輸入版本
            </p>
        </div>

        <div class="sidebar-section">
            <h3>快捷思考指令</h3>

            <button class="action-btn" onclick="addChildToSelected(true)">
                ＋ 子節點（Tab）
            </button>

            <button class="action-btn" onclick="addSiblingToSelected(true)">
                ↔ 同級節點（Enter）
            </button>

            <button class="action-btn" onclick="startReparentSelected()">
                ⇆ 轉父節點
            </button>

            <button class="action-btn" onclick="startUnlinkSelected()">
                ⛓ 取消兩點連結
            </button>

            <button class="action-btn" onclick="deleteSelected()">
                ✕ 刪除所選項目（Delete）
            </button>

            <div style="display:flex; gap:6px; margin-top:6px;">
                <button class="action-btn" onclick="undo()">⟲ Undo</button>
                <button class="action-btn" onclick="redo()">⟳ Redo</button>
            </div>
        </div>

        <div class="sidebar-section">
            <h3>語音輸入</h3>

            <button class="action-btn" onclick="requestPermanentMicrophonePermission()">
                🎤 啟用咪高峰權限
            </button>

            <div class="permission-status" id="permission-status">
                正在檢查咪高峰權限……
            </div>

            <p style="font-size:10px; color:var(--text-sub); margin-top:8px; line-height:1.5;">
                權限是否永久保留由瀏覽器控制。請選擇「允許」，並使用 HTTPS 或 localhost。
            </p>
        </div>

        <div class="sidebar-section">
            <h3>檔案備份</h3>

            <button class="action-btn" onclick="exportJSON()">
                ↓ 匯出 JSON
            </button>

            <button class="action-btn" onclick="importJSON()">
                ↑ 匯入 JSON
            </button>
        </div>

        <div class="sidebar-section">
            <h3>編輯方法</h3>

            <div style="font-size:11px; color:var(--text-sub); line-height:1.7;">
                • 雙擊節點或 Link Box 編輯<br>
                • Enter：文字換行<br>
                • Ctrl/Cmd + Enter：完成編輯<br>
                • Escape：取消編輯<br>
                • 拉動邊框控制點：改變大小<br>
                • 雙擊縮放控制點：自動配合文字高度
            </div>
        </div>
    </div>

    <button
        class="sidebar-toggle-btn"
        id="sidebar-toggle-btn"
        onclick="toggleSidebar()"
        title="開啟／收起側欄"
    >
        ◀
    </button>

    <div id="canvas-area">
        <div class="relationship-mode-banner" id="relationship-mode-banner"></div>
        <div id="tree-canvas">
            <svg id="lines-svg">
                <line
                    id="temp-link-line"
                    x1="0"
                    y1="0"
                    x2="0"
                    y2="0"
                    stroke="#ff9800"
                    stroke-width="2.5"
                    stroke-dasharray="6,4"
                    style="display:none;"
                ></line>
            </svg>
        </div>

        <div class="tip-banner">
            <span>💡 雙擊：多行編輯</span>
            <span>🎤 語音輸入</span>
            <span>↘ 拉動控制點：自由縮放</span>
        </div>

        <div class="zoom-controls">
            <button class="zoom-btn" onclick="zoomIn()" title="放大">＋</button>
            <button class="zoom-btn" onclick="zoomOut()" title="縮小">−</button>
            <button class="zoom-btn" onclick="backToCenter()" title="返回中心">⟲</button>
        </div>
    </div>

    <div class="adobe-picker-popover" id="adobe-picker">
        <div class="adobe-picker-header">
            <span>🎨 調色盤</span>

            <button
                style="background:none; border:none; color:var(--text); cursor:pointer;"
                onclick="closeAdobePicker()"
            >
                ✕
            </button>
        </div>

        <div class="picker-tabs">
            <div
                class="picker-tab active"
                id="tab-solid"
                onclick="setPickerMode('solid')"
            >
                單色
            </div>

            <div
                class="picker-tab"
                id="tab-gradient"
                onclick="setPickerMode('gradient')"
            >
                漸變
            </div>

            <div
                class="picker-tab"
                id="tab-sharp"
                onclick="setPickerMode('sharp')"
            >
                尖邊
            </div>
        </div>

        <div class="picker-row">
            <span>主色：</span>
            <input
                type="color"
                id="picker-c1"
                value="#1565c0"
                oninput="applyColorPicker()"
            >
        </div>

        <div class="picker-row">
            <span>次色：</span>
            <input
                type="color"
                id="picker-c2"
                value="#1e88e5"
                oninput="applyColorPicker()"
            >
        </div>

        <div class="picker-row">
            <span>角度：</span>
            <input
                type="range"
                id="picker-angle"
                min="0"
                max="360"
                value="135"
                style="width:90px;"
                oninput="applyColorPicker()"
            >
        </div>

        <div class="picker-row">
            <span>透明度：</span>
            <input
                type="range"
                id="picker-alpha"
                min="10"
                max="100"
                value="100"
                style="width:90px;"
                oninput="applyColorPicker()"
            >
        </div>
    </div>

    <script>
        "use strict";

        /* =========================
           Main data
        ========================= */

        let nodes = [];
        let crossLinks = [];

        let nextId = 0;
        let nextLinkId = 0;
        let nextBoxId = 0;

        let selectedId = null;
        let selectedBoxId = null;

        let scale = 1;
        let tx = 0;
        let ty = 0;

        let undoStack = [];
        let redoStack = [];
        let isRestoringHistory = false;

        let isPanning = false;
        let panStartX = 0;
        let panStartY = 0;

        let dragTarget = null;
        let resizeTarget = null;
        let gestureSnapshot = null;

        let dragMouseX = 0;
        let dragMouseY = 0;
        let gestureStartClientX = 0;
        let gestureStartClientY = 0;

        let linkMode = false;
        let linkFromId = null;
        
        let relationshipMode = null;
        /*
        relationshipMode:
        null       = 普通模式
        "reparent" = 轉父節點模式
        "unlink"   = 取消兩點連結模式
        */
        let relationshipSourceId = null;

        let editingTarget = null;

        let activePickerTarget = null;
        let pickerStartSnapshot = null;

        let activeRecognition = null;
        let activeSpeechButton = null;
        let speechSession = null;

        const MIN_NODE_WIDTH = 90;
        const MIN_NODE_HEIGHT = 40;
        const MIN_BOX_WIDTH = 80;
        const MIN_BOX_HEIGHT = 32;

        const canvasArea = document.getElementById("canvas-area");
        const treeCanvas = document.getElementById("tree-canvas");
        const svg = document.getElementById("lines-svg");
        const tempLinkLine = document.getElementById("temp-link-line");
        const adobePicker = document.getElementById("adobe-picker");
        const permissionStatus = document.getElementById("permission-status");
        const relationshipModeBanner = document.getElementById("relationship-mode-banner");

        /* =========================
           Startup
        ========================= */

        window.addEventListener("load", () => {
            const cx = 4000;
            const cy = 4000;

            const rootId = createNode(
                "中心主題",
                cx - 65,
                cy - 22,
                null,
                false,
                false
            );

            tx = -cx + canvasArea.offsetWidth / 2;
            ty = -cy + canvasArea.offsetHeight / 2;

            updateTransform();
            setupCanvasEvents();
            setupKeyboardShortcuts();
            checkMicrophonePermission();

            selectNode(rootId);
            drawLines();
        });

        /* =========================
           History
        ========================= */

        function captureState() {
            return JSON.stringify({
                nodes,
                crossLinks,
                nextId,
                nextLinkId,
                nextBoxId
            });
        }

        function pushHistorySnapshot(snapshot) {
            if (isRestoringHistory || !snapshot) return;

            const current = captureState();

            if (snapshot === current) return;

            undoStack.push(snapshot);

            if (undoStack.length > 60) {
                undoStack.shift();
            }

            redoStack = [];
        }

        function recordCurrentStateBeforeChange() {
            return captureState();
        }

        function undo() {
            finishCurrentEditing();

            if (!undoStack.length) return;

            isRestoringHistory = true;

            redoStack.push(captureState());

            const previous = JSON.parse(undoStack.pop());
            restoreState(previous);

            isRestoringHistory = false;
        }

        function redo() {
            finishCurrentEditing();

            if (!redoStack.length) return;

            isRestoringHistory = true;

            undoStack.push(captureState());

            const next = JSON.parse(redoStack.pop());
            restoreState(next);

            isRestoringHistory = false;
        }

        function restoreState(state) {
            stopSpeechRecognition(false);

            editingTarget = null;
            dragTarget = null;
            resizeTarget = null;
            gestureSnapshot = null;

            treeCanvas
                .querySelectorAll(".node, .link-box")
                .forEach((element) => element.remove());

            nodes = Array.isArray(state.nodes) ? state.nodes : [];
            crossLinks = Array.isArray(state.crossLinks)
                ? state.crossLinks
                : [];

            normaliseImportedData();

            nextId = Number.isFinite(state.nextId)
                ? state.nextId
                : getNextNodeId();

            nextLinkId = Number.isFinite(state.nextLinkId)
                ? state.nextLinkId
                : getNextLinkId();

            nextBoxId = Number.isFinite(state.nextBoxId)
                ? state.nextBoxId
                : getNextBoxId();

            selectedId = null;
            selectedBoxId = null;

            nodes.forEach(renderNode);
            renderLinkBoxes();
            drawLines();
        }

        function normaliseImportedData() {
            nodes.forEach((node) => {
                node.width = Number(node.width) || 130;
                node.height = Number(node.height) || 44;
                node.text = String(node.text ?? "新節點");
                node.opacity = node.opacity ?? 1;
                node.color1 = node.color1 || "#1565c0";
                node.color2 = node.color2 || "#1e88e5";
                node.colorType = node.colorType || "gradient";
                node.deg = Number(node.deg) || 135;
            });

            crossLinks.forEach((link) => {
                if (!Array.isArray(link.boxes)) {
                    link.boxes = [];
                }

                link.boxes.forEach((box) => {
                    box.width = Number(box.width) || 110;
                    box.height = Number(box.height) || 34;
                    box.text = String(box.text ?? "連結");
                    box.opacity = box.opacity ?? 0.95;
                    box.color1 = box.color1 || "#ffffff";
                    box.color2 = box.color2 || "#ffffff";
                    box.colorType = box.colorType || "solid";
                    box.deg = Number(box.deg) || 135;
                });
            });
        }

        function getNextNodeId() {
            return nodes.reduce(
                (maximum, node) => Math.max(maximum, Number(node.id) + 1),
                0
            );
        }

        function getNextLinkId() {
            return crossLinks.reduce(
                (maximum, link) => Math.max(maximum, Number(link.id) + 1),
                0
            );
        }

        function getNextBoxId() {
            let maximum = 0;

            crossLinks.forEach((link) => {
                link.boxes.forEach((box) => {
                    maximum = Math.max(maximum, Number(box.id) + 1);
                });
            });

            return maximum;
        }

        /* =========================
           Sidebar
        ========================= */

        function toggleSidebar() {
            const sidebar = document.getElementById("sidebar");
            const toggleButton = document.getElementById("sidebar-toggle-btn");

            sidebar.classList.toggle("collapsed");

            toggleButton.textContent = sidebar.classList.contains("collapsed")
                ? "▶"
                : "◀";
        }

        /* =========================
           Node creation/rendering
        ========================= */

        function createNode(
            text,
            x,
            y,
            parentId,
            autoEdit = false,
            recordHistory = true
        ) {
            const historySnapshot = recordHistory
                ? recordCurrentStateBeforeChange()
                : null;

            const parent = nodes.find((node) => node.id === parentId);

            const node = {
                id: nextId++,
                text: String(text ?? "新節點"),
                x,
                y,
                parentId,
                width: 130,
                height: 44,
                color1: parent ? parent.color1 : "#1565c0",
                color2: parent ? parent.color2 : "#1e88e5",
                colorType: parent ? parent.colorType : "gradient",
                opacity: parent ? parent.opacity : 1,
                deg: parent ? parent.deg : 135
            };

            nodes.push(node);
            renderNode(node);
            drawLines();

            if (historySnapshot) {
                pushHistorySnapshot(historySnapshot);
            }

            if (autoEdit) {
                window.setTimeout(() => {
                    startTextEdit("node", node.id);
                }, 40);
            }

            return node.id;
        }

        function renderNode(node) {
            node.width = Number(node.width) || 130;
            node.height = Number(node.height) || 44;

            const element = document.createElement("div");

            element.className = "node";
            element.id = `node-${node.id}`;
            element.dataset.nodeId = node.id;

            setElementGeometry(element, node);
            applyStyle(element, node);

            const content = document.createElement("div");
            content.className = "node-content";

            const text = document.createElement("span");
            text.className = "node-text";
            text.textContent = node.text;

            content.appendChild(text);
            element.appendChild(content);

            const quickAdd = document.createElement("button");
            quickAdd.type = "button";
            quickAdd.className = "node-quick-add";
            quickAdd.textContent = "+";
            quickAdd.title = "新增子節點";

            quickAdd.addEventListener("mousedown", stopInteractiveEvent);

            quickAdd.addEventListener("click", (event) => {
                event.stopPropagation();
                addChildTo(node.id, true);
            });

            element.appendChild(quickAdd);

            const menuTrigger = document.createElement("button");
            menuTrigger.type = "button";
            menuTrigger.className = "inplace-menu-trigger";
            menuTrigger.textContent = "✎";
            menuTrigger.title = "開啟節點選單";

            menuTrigger.addEventListener("mousedown", stopInteractiveEvent);

            menuTrigger.addEventListener("click", (event) => {
                event.stopPropagation();
                toggleInplaceMenu(node.id);
            });

            element.appendChild(menuTrigger);

            const speechButton = createSpeechButton("node", node.id);
            element.appendChild(speechButton);

            const menu = document.createElement("div");
            menu.className = "inplace-action-menu";
            menu.id = `menu-${node.id}`;

            menu.innerHTML = `
                <button
                    type="button"
                    class="inplace-btn"
                    title="加子節點"
                    onclick="event.stopPropagation(); addChildTo(${node.id}, true)"
                >＋</button>

                <button
                    type="button"
                    class="inplace-btn"
                    title="加同級節點"
                    onclick="event.stopPropagation(); addSiblingTo(${node.id}, true)"
                >↔</button>

                <button
                    type="button"
                    class="inplace-btn"
                    title="轉父節點：選擇新父節點"
                    onclick="event.stopPropagation(); startReparent(${node.id})"
                >⇆</button>

                <button
                    type="button"
                    class="inplace-btn"
                    title="取消同另一節點嘅直接連線"
                    onclick="event.stopPropagation(); startUnlink(${node.id})"
                >⛓</button>

                <button
                    type="button"
                    class="inplace-btn"
                    title="跨節點連線"
                    onclick="event.stopPropagation(); startLink(${node.id})"
                >🔗</button>

                <button
                    type="button"
                    class="inplace-btn"
                    title="調色盤"
                    onclick="event.stopPropagation(); openPickerForNode(event, ${node.id})"
                >🎨</button>

                <button
                    type="button"
                    class="inplace-btn"
                    title="開始文字編輯"
                    onclick="event.stopPropagation(); startTextEdit('node', ${node.id})"
                >⌨</button>

                <button
                    type="button"
                    class="inplace-btn"
                    title="刪除"
                    onclick="event.stopPropagation(); deleteNodeById(${node.id})"
                >✕</button>
            `;

            menu.addEventListener("mousedown", stopInteractiveEvent);
            element.appendChild(menu);

            addResizeHandles(element, "node", node);

            element.addEventListener("mousedown", (event) => {
                if (isInteractiveTarget(event.target)) return;
                if (editingTarget) return;

                event.stopPropagation();

                /*
                轉父節點／取消連結模式
                */
                if (relationshipMode) {
                    if (relationshipSourceId === node.id) {
                        return;
                    }

                    if (relationshipMode === "reparent") {
                        completeReparent(node.id);
                    } else if (relationshipMode === "unlink") {
                        completeUnlink(node.id);
                    }

                    return;
                }

                /*
                跨節點連線模式
                */
                if (linkMode) {
                    if (
                        linkFromId !== null &&
                        linkFromId !== node.id
                    ) {
                        completeLink(node.id);
                    }

                    return;
                }

                selectNode(node.id);
                beginDrag(event, "node", node, element);
            });

            element.addEventListener("dblclick", (event) => {
                if (isInteractiveTarget(event.target)) return;

                event.preventDefault();
                event.stopPropagation();

                if (!linkMode) {
                    startTextEdit("node", node.id);
                }
            });

            treeCanvas.appendChild(element);
        }

        /* =========================
           Link boxes
        ========================= */

        function renderLinkBoxes() {
            treeCanvas
                .querySelectorAll(".link-box")
                .forEach((element) => element.remove());

            crossLinks.forEach((link) => {
                link.boxes.forEach((box) => renderSingleLinkBox(box));
            });
        }

        function renderSingleLinkBox(box) {
            box.width = Number(box.width) || 110;
            box.height = Number(box.height) || 34;

            const element = document.createElement("div");

            element.className = "link-box";
            element.id = `box-${box.id}`;
            element.dataset.boxId = box.id;

            setElementGeometry(element, box);
            applyStyle(element, box);

            const content = document.createElement("div");
            content.className = "link-box-content";

            const text = document.createElement("span");
            text.className = "link-box-text";
            text.textContent = box.text;

            content.appendChild(text);
            element.appendChild(content);

            const colorButton = document.createElement("button");
            colorButton.type = "button";
            colorButton.className = "box-color-trigger";
            colorButton.textContent = "🎨";
            colorButton.title = "設定 Link Box 顏色";

            colorButton.addEventListener("mousedown", stopInteractiveEvent);

            colorButton.addEventListener("click", (event) => {
                event.stopPropagation();
                openPickerForBox(event, box.id);
            });

            element.appendChild(colorButton);

            const speechButton = createSpeechButton("box", box.id);
            element.appendChild(speechButton);

            addResizeHandles(element, "box", box);

            element.addEventListener("mousedown", (event) => {
                if (isInteractiveTarget(event.target)) return;
                if (editingTarget) return;

                event.stopPropagation();

                selectBox(box.id);
                beginDrag(event, "box", box, element);
            });

            element.addEventListener("dblclick", (event) => {
                if (isInteractiveTarget(event.target)) return;

                event.preventDefault();
                event.stopPropagation();

                startTextEdit("box", box.id);
            });

            treeCanvas.appendChild(element);
        }

        function findBoxById(boxId) {
            for (const link of crossLinks) {
                const box = link.boxes.find((item) => item.id === boxId);

                if (box) return box;
            }

            return null;
        }

        /* =========================
           Multiline text editing
        ========================= */

        function startTextEdit(type, id) {
            if (editingTarget) {
                if (
                    editingTarget.type === type &&
                    editingTarget.id === id
                ) {
                    editingTarget.textarea.focus();
                    return;
                }

                finishCurrentEditing();
            }

            stopSpeechRecognition(true);

            const item = type === "node"
                ? nodes.find((node) => node.id === id)
                : findBoxById(id);

            const element = document.getElementById(
                type === "node" ? `node-${id}` : `box-${id}`
            );

            if (!item || !element) return;

            if (type === "node") {
                selectNode(id);
            } else {
                selectBox(id);
            }

            const content = element.querySelector(
                type === "node"
                    ? ".node-content"
                    : ".link-box-content"
            );

            const textElement = content.querySelector(
                type === "node"
                    ? ".node-text"
                    : ".link-box-text"
            );

            const textarea = document.createElement("textarea");
            textarea.className = "text-editor";
            textarea.value = item.text;
            textarea.spellcheck = true;
            textarea.setAttribute(
                "aria-label",
                type === "node" ? "節點文字" : "連結文字"
            );

            textElement.style.display = "none";
            content.appendChild(textarea);
            element.classList.add("editing");

            editingTarget = {
                type,
                id,
                item,
                element,
                content,
                textElement,
                textarea,
                originalState: captureState(),
                originalItem: JSON.parse(JSON.stringify(item)),
                finished: false
            };

            textarea.addEventListener("mousedown", (event) => {
                event.stopPropagation();
            });

            textarea.addEventListener("dblclick", (event) => {
                event.stopPropagation();
            });

            textarea.addEventListener("input", () => {
                if (!editingTarget) return;

                item.text = textarea.value;

                autoGrowWhileEditing(
                    item,
                    element,
                    textarea,
                    type
                );

                drawLines();
            });

            textarea.addEventListener("keydown", (event) => {
                event.stopPropagation();

                if (
                    event.key === "Enter" &&
                    (event.ctrlKey || event.metaKey)
                ) {
                    event.preventDefault();
                    finishCurrentEditing();
                    return;
                }

                if (event.key === "Escape") {
                    event.preventDefault();
                    cancelCurrentEditing();
                    return;
                }

                if (event.key === "Tab") {
                    event.preventDefault();

                    const start = textarea.selectionStart;
                    const end = textarea.selectionEnd;
                    const value = textarea.value;

                    textarea.value =
                        value.slice(0, start) +
                        "    " +
                        value.slice(end);

                    textarea.selectionStart =
                        textarea.selectionEnd =
                            start + 4;

                    textarea.dispatchEvent(new Event("input"));
                }
            });

            textarea.addEventListener("blur", () => {
                window.setTimeout(() => {
                    if (
                        editingTarget &&
                        editingTarget.textarea === textarea &&
                        !element.contains(document.activeElement)
                    ) {
                        finishCurrentEditing();
                    }
                }, 0);
            });

            window.setTimeout(() => {
                textarea.focus();
                textarea.select();
            }, 0);
        }

        function autoGrowWhileEditing(
            item,
            element,
            textarea,
            type
        ) {
            const minimumHeight = type === "node"
                ? MIN_NODE_HEIGHT
                : MIN_BOX_HEIGHT;

            textarea.style.height = "1px";

            const verticalPadding = type === "node" ? 18 : 12;
            const requiredHeight =
                textarea.scrollHeight + verticalPadding;

            if (requiredHeight > item.height) {
                item.height = Math.max(
                    minimumHeight,
                    requiredHeight
                );

                element.style.height = `${item.height}px`;
            }

            textarea.style.height = "100%";
        }

        function finishCurrentEditing() {
            if (!editingTarget || editingTarget.finished) return;

            const session = editingTarget;
            session.finished = true;

            let newText = session.textarea.value;

            if (!newText.trim()) {
                newText = session.type === "node"
                    ? "新節點"
                    : "連結";
            }

            session.item.text = newText;
            session.textElement.textContent = newText;
            session.textElement.style.display = "";

            session.textarea.remove();
            session.element.classList.remove("editing");

            editingTarget = null;

            autoFitHeight(
                session.type,
                session.id,
                false
            );

            drawLines();

            pushHistorySnapshot(session.originalState);
        }

        function cancelCurrentEditing() {
            if (!editingTarget) return;

            const session = editingTarget;
            const original = session.originalItem;

            Object.keys(session.item).forEach((key) => {
                delete session.item[key];
            });

            Object.assign(session.item, original);

            session.textElement.textContent = session.item.text;
            session.textElement.style.display = "";

            session.textarea.remove();
            session.element.classList.remove("editing");

            setElementGeometry(session.element, session.item);
            applyStyle(session.element, session.item);

            editingTarget = null;

            drawLines();
        }

        /* =========================
           Auto fit text height
        ========================= */

        function autoFitHeight(type, id, recordHistory = true) {
            const item = type === "node"
                ? nodes.find((node) => node.id === id)
                : findBoxById(id);

            const element = document.getElementById(
                type === "node" ? `node-${id}` : `box-${id}`
            );

            if (!item || !element) return;

            const snapshot = recordHistory
                ? captureState()
                : null;

            const content = element.querySelector(
                type === "node"
                    ? ".node-content"
                    : ".link-box-content"
            );

            const minimumHeight = type === "node"
                ? MIN_NODE_HEIGHT
                : MIN_BOX_HEIGHT;

            const verticalPadding = type === "node" ? 18 : 12;

            const oldHeight = element.style.height;

            element.style.height = `${minimumHeight}px`;
            item.height = minimumHeight;

            const requiredHeight = Math.max(
                minimumHeight,
                content.scrollHeight + verticalPadding
            );

            item.height = requiredHeight;
            element.style.height = `${requiredHeight}px`;

            if (!requiredHeight) {
                element.style.height = oldHeight;
            }

            drawLines();

            if (snapshot) {
                pushHistorySnapshot(snapshot);
            }
        }

        /* =========================
           Resize
        ========================= */

        function addResizeHandles(element, type, item) {
            const directions = [
                "n",
                "s",
                "e",
                "w",
                "ne",
                "nw",
                "se",
                "sw"
            ];

            directions.forEach((direction) => {
                const handle = document.createElement("div");

                handle.className = `resize-handle ${direction}`;
                handle.dataset.resizeDirection = direction;
                handle.title =
                    "拖曳改變大小；雙擊自動配合文字高度";

                handle.addEventListener("mousedown", (event) => {
                    event.preventDefault();
                    event.stopPropagation();

                    if (editingTarget) {
                        finishCurrentEditing();
                    }

                    beginResize(
                        event,
                        type,
                        item,
                        element,
                        direction
                    );
                });

                handle.addEventListener("dblclick", (event) => {
                    event.preventDefault();
                    event.stopPropagation();

                    autoFitHeight(type, item.id, true);
                });

                element.appendChild(handle);
            });
        }

        function beginResize(
            event,
            type,
            item,
            element,
            direction
        ) {
            if (type === "node") {
                selectNode(item.id);
            } else {
                selectBox(item.id);
            }

            gestureSnapshot = captureState();

            gestureStartClientX = event.clientX;
            gestureStartClientY = event.clientY;

            resizeTarget = {
                type,
                item,
                element,
                direction,
                startX: item.x,
                startY: item.y,
                startWidth: item.width,
                startHeight: item.height,
                moved: false
            };
        }

        function updateResize(event) {
            if (!resizeTarget) return;

            const target = resizeTarget;
            const dx =
                (event.clientX - gestureStartClientX) / scale;
            const dy =
                (event.clientY - gestureStartClientY) / scale;

            const direction = target.direction;

            const minimumWidth = target.type === "node"
                ? MIN_NODE_WIDTH
                : MIN_BOX_WIDTH;

            const minimumHeight = target.type === "node"
                ? MIN_NODE_HEIGHT
                : MIN_BOX_HEIGHT;

            let newX = target.startX;
            let newY = target.startY;
            let newWidth = target.startWidth;
            let newHeight = target.startHeight;

            if (direction.includes("e")) {
                newWidth = Math.max(
                    minimumWidth,
                    target.startWidth + dx
                );
            }

            if (direction.includes("s")) {
                newHeight = Math.max(
                    minimumHeight,
                    target.startHeight + dy
                );
            }

            if (direction.includes("w")) {
                newWidth = Math.max(
                    minimumWidth,
                    target.startWidth - dx
                );

                newX =
                    target.startX +
                    target.startWidth -
                    newWidth;
            }

            if (direction.includes("n")) {
                newHeight = Math.max(
                    minimumHeight,
                    target.startHeight - dy
                );

                newY =
                    target.startY +
                    target.startHeight -
                    newHeight;
            }

            target.item.x = newX;
            target.item.y = newY;
            target.item.width = newWidth;
            target.item.height = newHeight;

            setElementGeometry(target.element, target.item);

            if (
                Math.abs(event.clientX - gestureStartClientX) > 1 ||
                Math.abs(event.clientY - gestureStartClientY) > 1
            ) {
                target.moved = true;
            }

            drawLines();
        }

        /* =========================
           Dragging
        ========================= */

        function beginDrag(event, type, item, element) {
            const rect = canvasArea.getBoundingClientRect();

            gestureSnapshot = captureState();

            gestureStartClientX = event.clientX;
            gestureStartClientY = event.clientY;

            dragMouseX =
                (event.clientX - rect.left - tx) / scale -
                item.x;

            dragMouseY =
                (event.clientY - rect.top - ty) / scale -
                item.y;

            dragTarget = {
                type,
                item,
                element,
                moved: false
            };
        }

        function updateDrag(mouseX, mouseY, event) {
            if (!dragTarget) return;

            dragTarget.item.x = mouseX - dragMouseX;
            dragTarget.item.y = mouseY - dragMouseY;

            dragTarget.element.style.left =
                `${dragTarget.item.x}px`;

            dragTarget.element.style.top =
                `${dragTarget.item.y}px`;

            if (
                Math.abs(event.clientX - gestureStartClientX) > 2 ||
                Math.abs(event.clientY - gestureStartClientY) > 2
            ) {
                dragTarget.moved = true;
            }

            drawLines();
        }

        function finishGesture() {
            const moved =
                (dragTarget && dragTarget.moved) ||
                (resizeTarget && resizeTarget.moved);

            if (moved && gestureSnapshot) {
                pushHistorySnapshot(gestureSnapshot);
            }

            dragTarget = null;
            resizeTarget = null;
            gestureSnapshot = null;
        }

        /* =========================
           Selection
        ========================= */

        function selectNode(id) {
            selectedId = id;
            selectedBoxId = null;

            document
                .querySelectorAll(".node")
                .forEach((element) => {
                    element.classList.remove("selected");
                });

            document
                .querySelectorAll(".link-box")
                .forEach((element) => {
                    element.classList.remove("selected");
                });

            document
                .getElementById(`node-${id}`)
                ?.classList.add("selected");

        function selectBox(id) {
            selectedBoxId = id;
            selectedId = null;

            document
                .querySelectorAll(".node")
                .forEach((element) => {
                    element.classList.remove("selected");
                });

            document
                .querySelectorAll(".link-box")
                .forEach((element) => {
                    element.classList.remove("selected");
                });

            document
                .getElementById(`box-${id}`)
                ?.classList.add("selected");
